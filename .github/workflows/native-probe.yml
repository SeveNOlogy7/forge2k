name: Native build probe (TEMPORARY, phase-6 Wave 3 t7)

# TEMPORARY probe artifact, not part of the product surface.
#
# Purpose (phase-6 plan sess_781cb816, Wave 3 task 7 - "xian xing shi zheng,
# zheng wei ji ting" / probe-first, stop on falsification): prove, with the
# EXISTING forge2k code and zero product changes, whether a GitHub-hosted
# ubuntu-latest runner can run the native build path end to end with the
# default combination (cpu=x86_64 / mpi=mpich / variant=psmp / cuda=none):
#   - apt/gcc toolchain present on a bare runner?
#   - install_cp2k_toolchain.sh feasible outside a container?
#   - system mpich + libmpich-dev sufficient for --with-mpich=system?
#   - the produced exe is executable (--version smoke)?
#
# The verdict is read by the main agent from the PROBE_VERDICT matrix plus
# the raw markers (a green job alone MUST NOT be read as a pass: the native
# code returns success even when the exe is missing, which is why the
# exe-existence and smoke criteria exist as separate evidence). Falsification
# of any criterion stops Waves 4-6. DELETE this workflow once the dispatch
# evidence is recorded (plan t7: temporary artifact, removed after dispatch).
#
# Probe-side environment accommodation (workflow-only; product code,
# dockerfiles and other workflows are untouched):
#   - system mpich + libmpich-dev via apt: the runner ships no MPI and the
#     toolchain runs with --with-mpich=system; the product-level prereq fix
#     is Wave 4 (plan default 11), so the probe installs them explicitly.
#   - /opt/cp2k_build needs no privilege step: GitHub runner images run
#     "chmod -R 777 /opt" (actions/runner-images configure-system.sh), so the
#     runner user can create the work dir; the pre-apt step transcribes the
#     permission state as dispatch-time evidence.
#
# Exit semantics: the build step itself is the exit-code gate (tee must not
# swallow the code); the exe-existence step is a hard assertion; the smoke
# ladder records a verdict marker WITHOUT failing the job (plan t7
# pre-registers the two-route ladder and leaves the final reading to the main
# agent). The summary step prints the four-criterion matrix and PROBE_VERDICT.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-probe:
    name: native probe (x86_64 / mpich / psmp / none)
    runs-on: ubuntu-latest
    # Plan default 9: toolchain ~1.5-3h + cp2k make ~2-4h on 4 cores can
    # approach the cap; 350 min job / 340 min build step stay under the 6h
    # GitHub hard cap. A job timeout with the log and transcript on disk is
    # still readable evidence (the summary step runs on always()).
    timeout-minutes: 350
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo build (debug binary used to drive the probe)
        run: cargo build

      # ---- df / runner facts calibration transcript (plan risk 4) --------
      - name: runner facts + df checkpoint apt-pre
        run: |
          echo "===== DF_CHECKPOINT:apt-pre at $(date -u +%Y-%m-%dT%H:%M:%SZ) =====" | tee df-transcript.txt
          df -h / | tee -a df-transcript.txt
          echo "===== RUNNER_FACTS begin ====="
          echo "os: $(grep PRETTY_NAME /etc/os-release | cut -d= -f2-)"
          echo "kernel: $(uname -r)"
          echo "cores: $(nproc)"
          free -h || true
          echo "df of workspace:"
          df -h "$GITHUB_WORKSPACE" || true
          echo "ls -ld /opt:"
          ls -ld /opt || true
          if [ -w /opt ]; then echo "/opt writable by runner user: yes"; else echo "/opt writable by runner user: no"; fi
          echo "===== RUNNER_FACTS end ====="

      - name: install system mpich + libmpich-dev (missing prereq fix lands in Wave 4)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y mpich libmpich-dev
          echo "===== MPICH_EVIDENCE begin ====="
          which mpicc
          mpicc --version 2>&1 | sed -n '1,3p'
          which mpirun
          mpirun --version 2>&1 | sed -n '1,2p'
          dpkg-query -W mpich libmpich-dev || true
          echo "===== MPICH_EVIDENCE end ====="

      - name: df checkpoint toolchain-pre (before the native build starts)
        run: |
          echo "===== DF_CHECKPOINT:toolchain-pre at $(date -u +%Y-%m-%dT%H:%M:%SZ) =====" | tee -a df-transcript.txt
          df -h / | tee -a df-transcript.txt

      - name: ./target/debug/forge2k build -m native -v 2023.2 --cpu x86_64
        timeout-minutes: 340
        run: |
          # The default Actions shell already runs bash -e -o pipefail; -e is
          # lifted around the pipeline so the build's exit code can be
          # captured and turned into an explicit gate below (the tee must not
          # swallow it, and a non-zero exit still has to reach the marker).
          : > native-build-log.txt
          df_snapshot() {
            echo "===== DF_CHECKPOINT:$1 at $(date -u +%Y-%m-%dT%H:%M:%SZ) ====="
            df -h /
          }
          # Phase-marker disk sampler: forge2k logs "Step 4/6 ... toolchain"
          # and "Step 5/6: Building CP2K" into the teed log, so a tail
          # watcher snapshots df exactly at those two phase boundaries (the
          # whole build is one process and cannot be checkpointed from
          # outside). It breaks after the make boundary (tail then dies on
          # SIGPIPE); stdio is detached so a lingering tail can never stall
          # the step pipe.
          (
            tail -F -n +1 native-build-log.txt 2>/dev/null | while IFS= read -r line; do
              case "$line" in
                *"Step 4/6"*)
                  df_snapshot toolchain-begin >> df-transcript.txt ;;
                *"Step 5/6"*)
                  df_snapshot make-pre >> df-transcript.txt
                  break ;;
              esac
            done
          ) >/dev/null 2>&1 &
          echo "phase-marker df sampler started in background"

          start=$(date +%s)
          set -o pipefail
          set +e
          ./target/debug/forge2k build -m native -v 2023.2 --cpu x86_64 2>&1 | tee native-build-log.txt
          rc=${PIPESTATUS[0]}
          set -e
          elapsed=$(( $(date +%s) - start ))

          df_snapshot final-state | tee -a df-transcript.txt
          {
            echo "BUILD_EXITCODE=${rc}"
            echo "BUILD_ELAPSED_SECONDS=${elapsed}"
          } > build-facts.txt
          echo "BUILD_EXITCODE=${rc} (captured via PIPESTATUS[0]; tee did not swallow it)"
          echo "BUILD_ELAPSED_SECONDS=${elapsed}"
          if [ "${rc}" -eq 0 ]; then
            echo "BUILD_GATE:PASS"
          else
            echo "BUILD_GATE:FAIL"
          fi
          # The build exit code IS the gate (plan t7 criterion 1); the later
          # steps are always() so the assertion, the smoke ladder, the
          # summary and the evidence upload still run on failure.
          exit "${rc}"

      - name: "assert exe exists: test -x /opt/cp2k_build/cp2k/exe/local/cp2k.psmp"
        if: always()
        run: |
          echo "===== EXE_ASSERT begin: test -x /opt/cp2k_build/cp2k/exe/local/cp2k.psmp ====="
          if test -x /opt/cp2k_build/cp2k/exe/local/cp2k.psmp; then
            echo "EXE_ASSERT:PASS"
            stat -c 'size=%s bytes mode=%A owner=%U:%G mtime=%y' /opt/cp2k_build/cp2k/exe/local/cp2k.psmp
            file /opt/cp2k_build/cp2k/exe/local/cp2k.psmp || true
            ls -l /opt/cp2k_build/cp2k/exe/local/
          else
            echo "EXE_ASSERT:FAIL (missing or not executable)"
            echo "--- diagnostics: work dir listing ---"
            ls -ld /opt/cp2k_build /opt/cp2k_build/cp2k 2>&1 || true
            ls -la /opt/cp2k_build/cp2k/exe/ 2>&1 || true
            ls -la /opt/cp2k_build/cp2k/exe/local/ 2>&1 || true
            echo "--- diagnostics: build log tail ---"
            tail -n 40 native-build-log.txt 2>&1 || true
            exit 1
          fi

      - name: "smoke ladder: cp2k.psmp --version (direct, then toolchain setup fallback)"
        if: always()
        run: |
          # Plan default 8 / t7 pre-registered ladder: route 1 runs the exe
          # directly; route 2 sources the toolchain install/setup (the exe
          # links against toolchain-prefix libs; setup injects
          # LD_LIBRARY_PATH). Passing = the route's output contains "CP2K"
          # AND the route exited 0: requiring rc 0 as well is the stricter
          # reading of the plan criterion ("output contains CP2K"), and for a
          # probe a false PASS costs more than a false FAIL (falsification
          # stops Waves 4-6); both rc values are recorded either way.
          EXE=/opt/cp2k_build/cp2k/exe/local/cp2k.psmp
          SETUP=/opt/cp2k_build/cp2k/tools/toolchain/install/setup
          direct_out=""
          direct_rc=127
          if [ -x "${EXE}" ]; then
            echo "===== SMOKE route=direct begin (timeout 180s) ====="
            if direct_out=$(timeout 180 "${EXE}" --version 2>&1); then direct_rc=0; else direct_rc=$?; fi
            echo "${direct_out}"
            echo "===== SMOKE route=direct end rc=${direct_rc} ====="
          else
            echo "===== SMOKE route=direct skipped: exe not executable ====="
          fi
          if [ "${direct_rc}" -eq 0 ] && grep -q "CP2K" <<< "${direct_out}"; then
            echo "SMOKE_VERDICT:PASS route=direct rc=0"
            echo "SMOKE_VERDICT:PASS route=direct rc=0" > smoke-result.txt
            exit 0
          fi
          setup_out=""
          setup_rc=127
          if [ -f "${SETUP}" ]; then
            echo "===== SMOKE route=setup-fallback begin (source setup; timeout 180s) ====="
            if setup_out=$(bash -c "source '${SETUP}' && timeout 180 '${EXE}' --version" 2>&1); then setup_rc=0; else setup_rc=$?; fi
            echo "${setup_out}"
            echo "===== SMOKE route=setup-fallback end rc=${setup_rc} ====="
          else
            echo "===== SMOKE route=setup-fallback skipped: ${SETUP} missing ====="
          fi
          if [ "${setup_rc}" -eq 0 ] && grep -q "CP2K" <<< "${setup_out}"; then
            echo "SMOKE_VERDICT:PASS route=setup-fallback rc=0"
            echo "SMOKE_VERDICT:PASS route=setup-fallback rc=0" > smoke-result.txt
            exit 0
          fi
          verdict="SMOKE_VERDICT:FAIL both routes (direct rc=${direct_rc}, setup rc=${setup_rc})"
          echo "${verdict}"
          echo "${verdict}" > smoke-result.txt
          # Deliberately NOT a hard job failure (plan t7): the marker and the
          # summary matrix carry the verdict to the main agent, the captured
          # stdout/stderr above carries the evidence.
          exit 0

      - name: post-probe summary (four-criterion matrix -> job summary)
        if: always()
        run: |
          # Tolerant reporting step: never fails the job itself.
          set +e
          EXE=/opt/cp2k_build/cp2k/exe/local/cp2k.psmp
          # Backstop terminal disk snapshot: covers the case where the build
          # step was killed by its 340-min timeout before its own
          # final-state snapshot.
          {
            echo "===== DF_CHECKPOINT:post-job at $(date -u +%Y-%m-%dT%H:%M:%SZ) ====="
            df -h /
          } | tee -a df-transcript.txt

          rc=$(awk -F= '$1=="BUILD_EXITCODE"{print $2}' build-facts.txt 2>/dev/null)
          elapsed=$(awk -F= '$1=="BUILD_ELAPSED_SECONDS"{print $2}' build-facts.txt 2>/dev/null)
          smoke=$(sed -n '1p' smoke-result.txt 2>/dev/null)
          labels=$(grep -o 'DF_CHECKPOINT:[a-z-]*' df-transcript.txt 2>/dev/null | sed 's/^DF_CHECKPOINT://' | sort -u | paste -sd, -)
          peak_avail=$(awk 'NF>=6 && $6=="/" {print $4}' df-transcript.txt 2>/dev/null | sort -h | sed -n '1p')

          c1=FAIL; [ "${rc}" = "0" ] && c1=PASS
          c2=FAIL; [ -x "${EXE}" ] && c2=PASS
          c3=FAIL; case "${smoke}" in SMOKE_VERDICT:PASS*) c3=PASS ;; esac
          c4=FAIL
          case "${labels}" in
            *apt-pre*) case "${labels}" in *final-state*|*post-job*) c4=PASS ;; esac ;;
          esac

          verdict=FAIL
          if [ "${c1}" = PASS ] && [ "${c2}" = PASS ] && [ "${c3}" = PASS ] && [ "${c4}" = PASS ]; then
            verdict=PASS
          fi

          {
            echo "## native probe: four-criterion matrix (phase-6 Wave 3 t7)"
            echo ""
            echo "| # | criterion | result |"
            echo "|---|---|---|"
            echo "| 1 | build exit code 0 (PIPESTATUS[0], tee-safe) | ${c1} (exit=${rc:-absent}) |"
            echo "| 2 | exe exists and is executable | ${c2} |"
            echo "| 3 | smoke ladder output contains CP2K | ${c3} (${smoke:-no smoke-result.txt}) |"
            echo "| 4 | df transcript recorded | ${c4} (labels: ${labels:-none}) |"
            echo ""
            echo "PROBE_VERDICT: ${verdict} (all four must pass; judge from the raw markers in the log and the artifact, this table is a mechanical roll-up)"
            echo ""
            echo "facts: build elapsed ${elapsed:-n/a}s; min disk Avail seen on /: ${peak_avail:-n/a}; exe: ${EXE}"
          } | tee probe-verdict.txt

          cat probe-verdict.txt >> "$GITHUB_STEP_SUMMARY"
          echo "PROBE_VERDICT=${verdict}"
          exit 0

      - name: upload probe evidence (native-build-log.txt + transcripts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-log
          path: |
            native-build-log.txt
            df-transcript.txt
            build-facts.txt
            smoke-result.txt
            probe-verdict.txt
          retention-days: 2
          if-no-files-found: warn
