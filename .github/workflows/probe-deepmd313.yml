name: probe-deepmd313 (TEMPORARY, wave deepmd-revival)

# TEMPORARY probe artifact, not part of the product surface.
# DELETE together with the wave once the dispatch evidence is recorded
# (convention: separate add commit -> dispatch -> separate remove commit).
#
# Purpose (wave deepmd-revival): test the hypothesis that the deepmd compute
# SIGSEGV (rc=139 after the model loads, during compute; np1/np2 die at the
# same point; evidence runs 38682037203 / 38707255454) is the
# "deepmd-kit 3.1.0 + libtorch 2.7.1" version pair, i.e. that the upstream
# spack route (which pins deepmdkit@3.1.3) selects a combination the
# toolchain route does not. Mechanism: inject a deepmd-kit 3.1.3 self-build
# into the GENERATED (--features deepmd) Dockerfile and pin it through the
# toolchain user-path contract (--with-deepmd=<dir>) instead of the
# upstream-pinned 3.1.0 (cp2k support/v2026.2
# tools/toolchain/scripts/stage6/install_deepmd.sh:9).
#
# Feasibility evidence (upstream fetched 2026-10-16; full transcript in
# .omz/runtime/sess_11c1d90d-3960-4a86-b79e-c9a3835bab0b/results/deepmd-probe313.md):
#   - user-path contract: install_deepmd.sh:58-63 (case `*)`) only
#     check_dir's ${with_deepmd}/include/deepmd and ${with_deepmd}/lib, never
#     downloads; the env block (:66-79) exports DEEPMD_ROOT and prepends
#     LD_LIBRARY_PATH/LD_RUN_PATH/LIBRARY_PATH/CMAKE_PREFIX_PATH. read_with
#     maps `no` -> __DONTUSE__ (tool_kit.sh:606-608), a path stays literal.
#   - torch gate PASSES: deepmd-kit v3.1.3 source/CMakeLists.txt:337-341
#     find_package(Torch REQUIRED) has a LOWER bound only (>=2.1.0 raises
#     CMAKE_CXX_STANDARD to 17; >=1.5.0 to 14) -- no upper bound, so the
#     toolchain's libtorch 2.7.1 (install_libtorch.sh:11) qualifies; a second
#     user path for torch is NOT needed.
#   - build/install surface 3.1.0 -> 3.1.3: source/api_c/CMakeLists.txt and
#     source/op/pt/CMakeLists.txt BYTE-IDENTICAL; source/lib/CMakeLists.txt
#     BYTE-IDENTICAL (exports the same target set, installs to lib/);
#     the C API function set is unchanged. Root CMakeLists delta is
#     cmake_minimum 3.25.2 (toolchain ships cmake 4.3.0), a CUDA-13 C++17
#     bump and a torch>=2.8 ABI special case -- no new REQUIRED dependency on
#     the CPU/build-only path. CP2K's link target set
#     (src/CMakeLists.txt:1771-1772: DeePMD::deepmd + DeePMD::deepmd_c)
#     stays resolvable.
#   - install prefix: ${INSTALLDIR}/deepmd-kit-3.1.3 -- NOT /opt/deepmd313:
#     the final image only receives /opt/cp2k/install, /opt/cp2k/data and
#     /toolchain -> /opt/cp2k/tools/toolchain, and the toolchain setup file
#     keeps ABSOLUTE paths, so the pinned tree must live inside the
#     distilled install tree or every runtime path dangles.
#
# Injection (two-pass toolchain use, both inside the generated Dockerfile):
#   pass 1 (edited): the generated toolchain RUN gets `--with-deepmd=no`
#     appended so deepmd-kit 3.1.0 is never downloaded/built; everything
#     else (libtorch 2.7.1, cmake 4.3.0, ...) installs exactly as in the
#     known-good deepmd image.
#   self-build: sha256-pinned tag archive -> cmake -DENABLE_PYTORCH=TRUE ->
#     `make deepmd_c` -> `make install` (install_deepmd.sh:37-48 minus the
#     -DCMAKE_CXX_STANDARD=11 pin, which 3.1.3's own set_if_higher logic
#     overrides to 17 for Torch>=2.1.0).
#   pass 2 (added): a second install_cp2k_toolchain.sh run with
#     --with-deepmd=<deepmd-kit-3.1.3 dir> re-runs all stages (installed
#     packages skip via install_successful checksums), takes the user-path
#     branch for deepmd and REGENERATES install/setup from scratch
#     (install_cp2k_toolchain.sh:1370 truncates; every stage re-appends its
#     setup_ block) with the 3.1.3 paths -- the generated CP2K build step
#     then resolves DeePMDConfig.cmake through the setup-exported
#     CMAKE_PREFIX_PATH.
#
# Judgement (as specified): rc=0 AND a `ENERGY| Total FORCE_EVAL` line AND
# "PROGRAM ENDED AT", at BOTH np1 and np2. The product pin
# (-17.266752586704772 +- 1e-6) is printed as informational comparison only.
# On failure the diagnostics step dumps the output tail and attempts a
# best-effort gdb backtrace; the recorded 3.1.0 crash signature is printed
# alongside for the same-point comparison (do not read a gdb miss as
# evidence: E1 also produced no backtrace).

on:
  workflow_dispatch:
  push:
    branches: [probe/deepmd313]

permissions:
  contents: read

jobs:
  probe:
    name: deepmd 3.1.3 user-path pin (generate -> inject -> build -> deepmd-water)
    runs-on: ubuntu-latest
    # Measured baseline: the deepmd-feature e2e run 38682037203 (toolchain
    # --install-all cold + CP2K cmake build + tests) completed in 1h42m.
    # This probe adds the deepmd313 self-build (~15-30min on 4 cores) and a
    # skip-most second toolchain pass (~5-10min): 350 min job cap keeps
    # ~2x headroom under the 6h GitHub hard cap (repo convention 350/340).
    timeout-minutes: 350
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo build (debug binary drives --generate-only)
        run: cargo build

      - name: "stage 1: forge2k --generate-only (features deepmd) + anchor facts"
        id: generate
        run: |
          set -o pipefail
          ./target/debug/forge2k build -m toolchain -v 2026.2 --cpu generic --cuda none --features deepmd --generate-only 2>&1 | tee gen-only.txt
          DF="$(sed -n 's/^Generated Dockerfile: //p' gen-only.txt | tail -n 1)"
          if [ -z "${DF}" ] || [ ! -f "${DF}" ]; then
            echo "GENERATE_VERDICT:FAIL (no generated Dockerfile path in output)" >&2
            exit 1
          fi
          echo "GEN_DOCKERFILE=${DF}" >> "${GITHUB_ENV}"
          echo "===== generated Dockerfile facts ====="
          sha256sum "${DF}"
          echo "anchor A count (--with-mpich=system && break;): $(grep -c -- '--with-mpich=system && break;' "${DF}" || true)"
          echo "anchor B count (sleep 10; done): $(grep -c -- 'sleep 10; done' "${DF}" || true)"
          grep -n -- '-DCP2K_USE_DEEPMD=ON\|-DCP2K_USE_LIBTORCH=ON' "${DF}" || true
          cp "${DF}" generated.Dockerfile
          echo "GENERATE_VERDICT:PASS"

      - name: "stage 2: inject deepmd-kit 3.1.3 self-build + user-path pin"
        id: inject
        run: |
          set -o pipefail
          mkdir -p probe-context
          python3 - "${GEN_DOCKERFILE}" probe-context/Dockerfile <<'PYEOF'
          import pathlib
          import sys

          src = pathlib.Path(sys.argv[1])
          dst = pathlib.Path(sys.argv[2])
          text = src.read_text(encoding="utf-8")

          # Anchor A: the toolchain pass-1 flag list; append --with-deepmd=no
          # so the upstream-pinned 3.1.0 is never downloaded or built.
          anchor_a = "    --with-mpich=system && break; \\\n"
          repl_a = "    --with-mpich=system \\\n    --with-deepmd=no && break; \\\n"
          n_a = text.count(anchor_a)
          print(f"ANCHOR_A (--with-mpich=system && break;) occurrences: {n_a}")
          if n_a != 1:
              sys.exit("ANCHOR_A not unique: generated Dockerfile drifted; refusing to inject")
          text = text.replace(anchor_a, repl_a)

          # Anchor B: end of the toolchain pass-1 RUN block.
          anchor_b = '    sleep 10; done"'
          n_b = text.count(anchor_b)
          print(f"ANCHOR_B (sleep 10; done) occurrences: {n_b}")
          if n_b != 1:
              sys.exit("ANCHOR_B not unique: generated Dockerfile drifted; refusing to inject")

          block = r'''# >>> probe-deepmd313 injection begin (TEMPORARY; delete with the wave) >>>
          # deepmd-kit 3.1.3 self-build, sha256-pinned, installed inside the
          # toolchain install tree (the only prefix the final image preserves).
          # cmake 4.3.0 + libtorch 2.7.1 come from toolchain pass 1 above; the
          # build commands mirror install_deepmd.sh:37-48 for 3.1.0 minus the
          # -DCMAKE_CXX_STANDARD=11 pin (v3.1.3's own set_if_higher raises the
          # standard to 17 for Torch >= 2.1.0, source/CMakeLists.txt:338-341).
          RUN --mount=type=cache,target=/opt/cp2k/tools/toolchain/build,id=toolchain-tarballs,sharing=locked \
          bash -c 'set -e; \
          DEEPMD_VER=3.1.3; \
          DEEPMD_SHA256=4387128aab98d9819b3484957a8857030f805cbab90c035c509ea87a72b182fa; \
          DEEPMD_DIR=/opt/cp2k/tools/toolchain/install/deepmd-kit-${DEEPMD_VER}; \
          cd /opt/cp2k/tools/toolchain/build; \
          PKG=deepmd-kit-${DEEPMD_VER}.tar.gz; \
          rm -f ${PKG}; \
          wget -q -O ${PKG} https://github.com/deepmodeling/deepmd-kit/archive/refs/tags/v${DEEPMD_VER}.tar.gz; \
          echo "${DEEPMD_SHA256}  ${PKG}" | sha256sum -c -; \
          rm -rf deepmd-kit-${DEEPMD_VER}; tar -xzf ${PKG}; \
          source /opt/cp2k/tools/toolchain/install/setup; \
          cd deepmd-kit-${DEEPMD_VER}/source; mkdir -p build; cd build; \
          cmake -DCMAKE_INSTALL_PREFIX=${DEEPMD_DIR} -DENABLE_PYTORCH=TRUE .. > cmake.log 2>&1 || { echo DEEPMD313_CMAKE_FAIL; tail -n 80 cmake.log; exit 1; }; \
          make -j$(nproc) deepmd_c > make.log 2>&1 || { echo DEEPMD313_MAKE_FAIL; tail -n 80 make.log; exit 1; }; \
          make install > install.log 2>&1 || { echo DEEPMD313_INSTALL_FAIL; tail -n 80 install.log; exit 1; }; \
          test -d ${DEEPMD_DIR}/include/deepmd; test -d ${DEEPMD_DIR}/lib; \
          ls -l ${DEEPMD_DIR}/lib | head -n 25; \
          echo DEEPMD313_BUILD_OK'

          # Toolchain pass 2: the user-path pin (install_deepmd.sh:58-63
          # branch). Installed packages skip via install_successful checksums;
          # the setup file is regenerated with DEEPMD_ROOT / LD_LIBRARY_PATH /
          # CMAKE_PREFIX_PATH pointing at deepmd-kit-3.1.3. The trailing
          # grep -c is a fail-loud assertion that the user-path env block
          # landed in install/setup.
          WORKDIR /opt/cp2k/tools/toolchain
          RUN --mount=type=cache,target=/opt/cp2k/tools/toolchain/build,id=toolchain-tarballs,sharing=locked \
              /bin/bash -c -o pipefail \
              "for i in 1 2 3; do ./install_cp2k_toolchain.sh -j ${NUM_PROCS:-8} \
              --install-all \
              --enable-cuda=no  \
              --target-cpu=generic \
              --with-cusolvermp=no \
              --with-gcc=system \
              --with-mpich=system \
              --with-deepmd=/opt/cp2k/tools/toolchain/install/deepmd-kit-3.1.3 && break; \
              echo \"toolchain deepmd user-path pass failed (attempt \$i)\"; \
              rm -rf /opt/cp2k/tools/toolchain/build/*; \
              [ \$i -eq 3 ] && exit 1; \
              sleep 10; done; \
              grep -c \"deepmd-kit-3.1.3\" /opt/cp2k/tools/toolchain/install/setup"
          # <<< probe-deepmd313 injection end <<<
          '''

          text = text.replace(anchor_b, anchor_b + "\n\n" + block, 1)

          for needle in (
              "--with-deepmd=no",
              "--with-deepmd=/opt/cp2k/tools/toolchain/install/deepmd-kit-3.1.3",
              "-DCP2K_USE_DEEPMD=ON",
              "DEEPMD313_BUILD_OK",
          ):
              if needle not in text:
                  sys.exit(f"post-injection invariant missing: {needle}")

          dst.write_text(text, encoding="utf-8", newline="\n")
          print(f"INJECTED_OK: {src} -> {dst} ({len(text.splitlines())} lines)")
          PYEOF
          echo "===== injected Dockerfile: injection region ====="
          awk '/probe-deepmd313 injection begin/,/probe-deepmd313 injection end/' probe-context/Dockerfile
          echo "===== injected vs generated (unified diff) ====="
          diff -u generated.Dockerfile probe-context/Dockerfile || true
          echo "INJECTED_DOCKERFILE_SHA256: $(sha256sum probe-context/Dockerfile | cut -d' ' -f1)"
          echo "INJECT_VERDICT:PASS"

      - name: "stage 3: docker build probe image (hard gate)"
        id: build
        timeout-minutes: 340
        run: |
          set -o pipefail
          echo "===== DOCKER BUILD begin at $(date -u +%Y-%m-%dT%H:%M:%SZ) ====="
          df -h /
          docker build --shm-size 2g \
            --build-arg NUM_PROCS="$(nproc)" \
            -f probe-context/Dockerfile \
            -t cp2k/cp2k:probe_deepmd313 \
            probe-context 2>&1 | tee docker-build.log
          rc=${PIPESTATUS[0]}
          echo "===== DOCKER BUILD end rc=${rc} at $(date -u +%Y-%m-%dT%H:%M:%SZ) ====="
          df -h /
          if [ "${rc}" -ne 0 ]; then
            echo "BUILD_VERDICT:FAIL rc=${rc} (see docker-build.log tail below)" >&2
            tail -n 60 docker-build.log || true
            exit 1
          fi
          echo "BUILD_VERDICT:PASS rc=0"

      - name: "stage 4: smoke + cp2kflags + deepmd 3.1.3 pin (hard gate)"
        id: smoke
        run: |
          set -o pipefail
          IMAGE=cp2k/cp2k:probe_deepmd313
          echo "===== smoke begin: cp2k --version ====="
          docker run --rm "${IMAGE}" cp2k --version 2>&1 | tee cp2k-version.txt
          grep -Eq 'cp2kflags:.*(^| )deepmd( |$)' cp2k-version.txt
          grep -Eq 'cp2kflags:.*(^| )libtorch( |$)' cp2k-version.txt
          echo "===== smoke end: deepmd + libtorch tokens present (hard gate) ====="
          echo "===== pin evidence: deepmd-kit tree + setup env in the image ====="
          docker run --rm "${IMAGE}" bash -c 'ls -d /opt/cp2k/tools/toolchain/install/deepmd-kit-* && grep -n "DEEPMD_ROOT\|install/deepmd-kit" /opt/cp2k/tools/toolchain/install/setup' | tee deepmd-pin.txt
          if ! grep -q "install/deepmd-kit-3.1.3" deepmd-pin.txt; then
            echo "SMOKE_VERDICT:FAIL deepmd-kit-3.1.3 not present in the image (user-path pin did not take)" >&2
            exit 1
          fi
          if grep -q "deepmd-kit-3.1.0" deepmd-pin.txt; then
            echo "SMOKE_VERDICT:FAIL deepmd-kit-3.1.0 present in the image (upstream pin not overridden)" >&2
            exit 1
          fi
          echo "SMOKE_VERDICT:PASS (3.1.3 pinned via user path; no 3.1.0 tree)"

      - name: "stage 5: deepmd-water np1/np2 -- rc=0 + ENERGY| + PROGRAM ENDED (hard gate)"
        id: functional
        run: |
          set -u
          IMAGE=cp2k/cp2k:probe_deepmd313
          fail=0
          for np in 1 2; do
            label="deepmd-water-np${np}"
            out="ci/cp2k-tests/deepmd-water.np${np}.out"
            echo "===== FUNCTIONAL run begin: ${label} (image ${IMAGE}) ====="
            rc=0
            docker run --rm --shm-size=1g \
              -v "$PWD/ci/cp2k-tests:/work" -w /work \
              "${IMAGE}" \
              bash -c "mpirun -np ${np} cp2k -i deepmd-water.inp -o deepmd-water.np${np}.out" || rc=$?
            echo "===== FUNCTIONAL run end: ${label} rc=${rc} ====="
            if [ "${rc}" -ne 0 ]; then
              echo "RUN_VERDICT[${label}]:FAIL rc=${rc} (139=SIGSEGV; the recorded 3.1.0 baseline died rc=139 after model load, during compute)"
              fail=1
            fi
            if [ ! -s "${out}" ]; then
              echo "RUN_VERDICT[${label}]:FAIL output missing or empty: ${out}"
              fail=1
              continue
            fi
            if grep -q "PROGRAM ENDED AT" "${out}"; then
              echo "RUN_VERDICT[${label}]: 'PROGRAM ENDED AT' present"
            else
              echo "RUN_VERDICT[${label}]:FAIL missing 'PROGRAM ENDED AT'"
              fail=1
            fi
            energy_line="$(grep -E '^[[:space:]]*ENERGY\| Total FORCE_EVAL \( [A-Za-z]+ \) energy' "${out}" | tail -n 1)"
            if [ -z "${energy_line}" ]; then
              echo "RUN_VERDICT[${label}]:FAIL no 'ENERGY| Total FORCE_EVAL' line"
              fail=1
            else
              energy_val="$(printf '%s\n' "${energy_line}" | awk '{print $NF}')"
              echo "RUN_VERDICT[${label}]: ${energy_line}"
              if printf '%s\n' "${energy_val}" | grep -Eq '^[+-]?([0-9]+(\.[0-9]*)?|\.[0-9]+)([eEdD][+-]?[0-9]+)?$'; then
                echo "RUN_VERDICT[${label}]: energy numeric ${energy_val} (upstream reference -17.266752586704772; informational)"
              else
                echo "RUN_VERDICT[${label}]:FAIL energy value not numeric: '${energy_val}'"
                fail=1
              fi
            fi
            # Informational only: the product assert (pin +- 1e-6). A pin miss
            # on a legitimately different deepmd version must not mask the
            # rc/ENERGY/PROGRAM-ENDED verdict this probe exists to produce.
            cp "${out}" ci/cp2k-tests/deepmd-water.inp.out
            bash ci/cp2k-tests/assert_cp2k_output.sh ci/cp2k-tests/deepmd-water.inp.out deepmd-water "${rc}" || true
          done
          echo "===== FUNCTIONAL evidence: deepmd ENERGY lines ====="
          grep -hE "ENERGY\|" ci/cp2k-tests/deepmd-water.np*.out || true
          if [ "${fail}" -ne 0 ]; then
            echo "FUNCTIONAL_VERDICT:FAIL" >&2
            exit 1
          fi
          echo "FUNCTIONAL_VERDICT:PASS (rc=0 + ENERGY| + PROGRAM ENDED at np1 and np2)"

      - name: "stage 5b: crash diagnostics -- output tail + best-effort gdb (functional failure only)"
        if: steps.functional.outcome == 'failure'
        run: |
          set -u
          IMAGE=cp2k/cp2k:probe_deepmd313
          echo "===== RECORDED 3.1.0 BASELINE (for same-point comparison) ====="
          echo "round 1 run 38682037203 / round 2 run 38707255454: rc=139 SIGSEGV after the DeePMD model loads, during compute; np1/np2 die at the same point; crash point byte-identical between rounds; E1 gdb produced no backtrace; libgomp-unify hypothesis refuted (round 2)."
          echo "===== output tails (new run) ====="
          for f in ci/cp2k-tests/deepmd-water.np*.out; do
            [ -f "${f}" ] || continue
            echo "----- ${f} (last 30 lines) -----"
            tail -n 30 "${f}" || true
          done
          echo "===== best-effort gdb backtrace (needs network; a miss is not evidence, E1 also missed) ====="
          timeout 900 docker run --rm --shm-size=1g \
            -v "$PWD/ci/cp2k-tests:/work" -w /work \
            "${IMAGE}" \
            bash -c "apt-get update -qq && apt-get install -y -qq gdb >/dev/null 2>&1 && gdb -batch -ex run -ex 'thread apply all bt' --args cp2k -i deepmd-water.inp -o gdb-deepmd-water.out" > gdb-backtrace.txt 2>&1 || true
          tail -n 80 gdb-backtrace.txt || true
          echo "DIAGNOSTICS_DONE"

      - name: probe verdict matrix (summary; never fails)
        if: always()
        run: |
          generate="${{ steps.generate.outcome }}"
          inject="${{ steps.inject.outcome }}"
          build="${{ steps.build.outcome }}"
          smoke="${{ steps.smoke.outcome }}"
          functional="${{ steps.functional.outcome }}"
          {
            echo "===== PROBE_VERDICT_MATRIX (deepmd313) ====="
            echo "stage1 generate-only        : ${generate}"
            echo "stage2 inject               : ${inject}"
            echo "stage3 docker build         : ${build}"
            echo "stage4 smoke+cp2kflags+pin  : ${smoke}"
            echo "stage5 deepmd-water np1/np2 : ${functional}"
          } | tee probe-verdict.txt
          if [ "${functional}" = "success" ]; then
            echo "PROBE_VERDICT:PASS - deepmd-kit 3.1.3 via the toolchain user path clears the gate; the upstream spack version-combination hypothesis holds for the toolchain route" | tee -a probe-verdict.txt
          else
            echo "PROBE_VERDICT:FAIL - 3.1.3 did not clear the gate; compare the crash point against the recorded 3.1.0 baseline before reassessing (a same-point crash falsifies the version-combination hypothesis)" | tee -a probe-verdict.txt
          fi

      - name: upload probe logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-deepmd313-logs
          path: |
            gen-only.txt
            generated.Dockerfile
            probe-context/Dockerfile
            docker-build.log
            cp2k-version.txt
            deepmd-pin.txt
            ci/cp2k-tests/deepmd-water.np*.out
            gdb-backtrace.txt
            probe-verdict.txt
          retention-days: 2
