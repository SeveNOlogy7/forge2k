name: E2E image build

# Manual, on-demand full image build verification on a GitHub runner.
# Local proxy networks are unreliable for large transfers (cp2k git clone,
# nvidia/cuda base images); the runner network is not. Run this from the
# Actions tab ("Run workflow") to validate the bundled Dockerfiles end to end.
# native_* variants (phase-6 Wave 6) build CP2K directly on the runner instead:
# no docker image is produced; acceptance = build exit code + exe existence
# assertion + --version smoke (all hard gates).
on:
  workflow_dispatch:
    inputs:
      variant:
        description: Build variant (CUDA toolchain / spack docker image, or native runner build without docker)
        type: choice
        required: true
        default: cuda_P100
        options:
          - cuda_P100
          - cuda_V100
          - spack_2025.2_x86_64
          - native_2023.2_x86_64_none
          - native_2023.2_generic_none

jobs:
  e2e-image:
    name: e2e image (${{ inputs.variant }})
    runs-on: ubuntu-latest
    # artifact transport (cross-run locate/download/prune) acts on Actions
    # data: read for the artifact channel, write for the prune DELETE
    # (phase-6 plan risk 10: short-lived GITHUB_TOKEN, workflow-scoped)
    permissions:
      contents: read
      actions: write
    # Toolchain build on a 4-core runner is expected to take 1.5-3h: 330 min.
    # Spack variant: deps compile ~4.2h + cp2k ~19min + push/transport, so 350
    # min (step cap 340). Native variant: toolchain install 1.5-3h + cp2k make
    # 2-4h, same 350/340 arithmetic (phase-6 plan default 9). All stay under
    # the 6h (360 min) GitHub hard cap.
    timeout-minutes: ${{ (inputs.variant == 'spack_2025.2_x86_64' || startsWith(inputs.variant, 'native_')) && 350 || 330 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: guard known variant (fail fast on unexpected dispatch input)
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          case "$VARIANT" in
            cuda_P100|cuda_V100|spack_2025.2_x86_64|native_2023.2_x86_64_none|native_2023.2_generic_none) echo "variant ok: $VARIANT" ;;
            *) echo "unknown variant: $VARIANT" >&2; exit 1 ;;
          esac

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo build (debug binary used to drive docker build)
        run: cargo build

      # --- spack buildcache transport -------------------------------------
      # actions/cache and BuildKit cache mounts are disconnected (the mount
      # store dies with the runner), so the content is ferried file-wise,
      # ring by ring:
      #   1. locate:  the artifact primary channel - a gh api ladder over
      #               successful runs of this workflow finds the previous
      #               run's spack-bc-x86_64-<dockerfiles/spack hash> artifact
      #               (cross-run, actions:read) and it is downloaded to
      #               ./bc-restore
      #   2. restore: conditional fallback only, engaged when the artifact
      #               channel missed: actions/cache (v4.3.0 pinned on both
      #               ends) -> host ./bc-restore, with sleep 240 + identical
      #               retry to wait out the cache service v2 index
      #               propagation window; the whole cache chain is gated
      #               off while an artifact hit stands (a stale or partial
      #               cache hit must never mix into ./bc-restore behind the
      #               artifact)
      #   3. seed:    host ./bc-restore -> cache mount id=spack-buildcache
      #               (busybox COPY into a layer, then cp into the mounted
      #               cache dir; mounts are keyed by id in the builder state
      #               shared by all builds of this job)
      #   4. build:   the bundled spack Dockerfiles consume/push the same
      #               mount (id pinned in the Dockerfiles)
      #   5. export:  cache mount -> host ./bc-export (busybox cp out of the
      #               mount, FROM scratch, buildx -o type=local)
      #   6. save:    host ./bc-export -> actions cache (same key) and ->
      #               upload-artifact (the next run's primary channel);
      #               after a successful upload, older same-prefix
      #               artifacts from previous runs are pruned
      # Why artifact-primary: the cache service v2 index is outside our
      # control - commit 3ebc74d's sleep/retry mitigation did not cure it:
      # saves kept succeeding while identical restores missed even hours
      # later - so the artifact channel leads and the cache chain only
      # walks on artifact miss; both miss -> cold build (unchanged).
      # Toolchain/CUDA variants skip every step guarded by the spack
      # condition below.

      - name: locate prior spack buildcache artifact (gh api ladder, cross-run)
        id: locate
        if: inputs.variant == 'spack_2025.2_x86_64'
        env:
          # gh does not pick up the Actions token implicitly; inject both.
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BC_NAME: spack-bc-x86_64-${{ hashFiles('dockerfiles/spack/**') }}
        run: |
          set -uo pipefail
          hit=false
          hit_run=""
          attempt=1
          while [ "${attempt}" -le 3 ]; do
            echo "locate attempt ${attempt}/3: scanning successful runs for artifact ${BC_NAME}"
            # newest-first candidate ladder over this workflow's successful runs
            run_ids=$(gh run list --workflow e2e-images.yml --status success --limit 10 --json databaseId --jq '.[].databaseId' 2>/dev/null || true)
            for rid in ${run_ids}; do
              found=$(gh api "repos/${GH_REPO}/actions/runs/${rid}/artifacts" \
                --jq ".artifacts[] | select(.name == \"${BC_NAME}\") | .id" 2>/dev/null | head -n1 || true)
              if [ -n "${found}" ]; then
                hit=true
                hit_run="${rid}"
                echo "artifact hit: ${BC_NAME} in run ${rid} (artifact id ${found})"
                break
              fi
            done
            if [ "${hit}" = true ]; then break; fi
            echo "not located yet (attempt ${attempt}/3); sleep 60"
            sleep 60
            attempt=$((attempt + 1))
          done
          echo "locate verdict: hit=${hit} run=${hit_run:-none}"
          echo "hit=${hit}" >> "$GITHUB_OUTPUT"
          echo "hit_run=${hit_run}" >> "$GITHUB_OUTPUT"

      - name: download prior spack buildcache artifact (cross-run -> host)
        if: steps.locate.outputs.hit == 'true'
        uses: actions/download-artifact@v4
        with:
          # Same landing path as the actions/cache restores below, so the
          # seed step's emptiness check needs no change.
          path: ./bc-restore
          name: spack-bc-x86_64-${{ hashFiles('dockerfiles/spack/**') }}
          # Cross-run download: pin the source run found by the locate step.
          run-id: ${{ steps.locate.outputs.hit_run }}
          github-token: ${{ github.token }}

      - name: restore spack buildcache (actions cache -> host)
        id: restore1
        if: steps.locate.outputs.hit != 'true' && inputs.variant == 'spack_2025.2_x86_64'
        uses: actions/cache/restore@v4.3.0
        with:
          path: ./bc-restore
          # The bundled spack Dockerfile hash is the proxy key for the spack
          # DAG hash (the deps yaml lives in the cp2k repo and cannot be
          # hashed here); the prefix fallback adopts partial hits from older
          # keys instead of discarding them.
          key: spack-bc-x86_64-${{ hashFiles('dockerfiles/spack/**') }}
          restore-keys: spack-bc-x86_64-

      # The cache service v2 index (actions/cache >= 4.2.0) can take minutes
      # to propagate after a save, so a restore may report "Cache not found"
      # while the save itself succeeded; waiting out the window and retrying
      # the identical restore generally recovers it (observed 3x on this
      # workflow: save ok, restore miss). Pin v4.3.0 on both ends to keep the
      # save/restore service versions from drifting apart.
      - name: absorb cache service v2 index propagation window
        if: steps.locate.outputs.hit != 'true' && inputs.variant == 'spack_2025.2_x86_64' && steps.restore1.outputs.cache-hit != 'true'
        run: sleep 240

      - name: restore spack buildcache retry (actions cache -> host)
        id: restore2
        if: steps.locate.outputs.hit != 'true' && inputs.variant == 'spack_2025.2_x86_64' && steps.restore1.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4.3.0
        with:
          path: ./bc-restore
          key: spack-bc-x86_64-${{ hashFiles('dockerfiles/spack/**') }}
          restore-keys: spack-bc-x86_64-

      # Deliberately keyed on the filesystem, not on restore outputs: either
      # restore landing content in ./bc-restore (including restore-keys
      # partial hits, which report cache-hit=false) must seed the mount.
      - name: seed BuildKit cache mount (host -> mount)
        if: inputs.variant == 'spack_2025.2_x86_64'
        run: |
          cat > seed-spack-bc.Dockerfile <<'EOF'
          FROM busybox
          COPY bc-restore/ /seed/
          RUN --mount=type=cache,target=/opt/spack-buildcache,id=spack-buildcache,sharing=locked \
              cp -a /seed/. /opt/spack-buildcache/
          EOF
          if [ -d bc-restore ] && [ -n "$(ls -A bc-restore 2>/dev/null)" ]; then
            echo "seeding cache mount id=spack-buildcache from ./bc-restore"
            DOCKER_BUILDKIT=1 docker build -f seed-spack-bc.Dockerfile -t spack-bc-seed .
          else
            echo "cache restore miss or empty; skip seed, cold build will populate the mount"
          fi

      - name: forge2k build -m toolchain -v 2023.2 --cpu generic --cuda $CUDA
        if: startsWith(inputs.variant, 'cuda_')
        timeout-minutes: 300
        env:
          # Map the dispatch choice to the forge2k --cuda value.
          CUDA: ${{ inputs.variant == 'cuda_V100' && 'V100' || 'P100' }}
        run: |
          set -o pipefail
          ./target/debug/forge2k build -m toolchain -v 2023.2 --cpu generic --cuda "$CUDA" 2>&1 | tee build-log.txt

      - name: forge2k build -m spack -v 2025.2 --cpu x86_64
        if: inputs.variant == 'spack_2025.2_x86_64'
        timeout-minutes: 340
        run: |
          set -o pipefail
          ./target/debug/forge2k build -m spack -v 2025.2 --cpu x86_64 2>&1 | tee build-log.txt

      - name: smoke test docker run cp2k --version (no NVIDIA driver on runner; tolerated)
        if: startsWith(inputs.variant, 'cuda_')
        env:
          CUDA: ${{ inputs.variant == 'cuda_V100' && 'V100' || 'P100' }}
        run: |
          echo "=== smoke begin: docker run --rm cp2k/cp2k:2023.2_mpich_generic_cuda_${CUDA}_psmp cp2k --version ==="
          docker run --rm cp2k/cp2k:2023.2_mpich_generic_cuda_${CUDA}_psmp cp2k --version || true
          echo "=== smoke end: runner has no NVIDIA driver, so this may fail without invalidating the job; the forge2k build step above is the acceptance gate ==="

      - name: smoke test docker run cp2k --version (spack variant; hard gate)
        if: inputs.variant == 'spack_2025.2_x86_64'
        run: |
          echo "=== smoke begin: docker run --rm cp2k/cp2k:2025.2_mpich_x86_64_psmp cp2k --version ==="
          docker run --rm cp2k/cp2k:2025.2_mpich_x86_64_psmp cp2k --version
          echo "=== smoke end: spack image has no GPU dependency, this step is a hard acceptance gate ==="

      - name: export spack buildcache (mount -> host)
        id: bcexport
        if: always() && inputs.variant == 'spack_2025.2_x86_64'
        run: |
          cat > export-spack-bc.Dockerfile <<'EOF'
          FROM busybox AS bcread
          RUN --mount=type=cache,target=/opt/spack-buildcache,id=spack-buildcache,sharing=locked \
              mkdir -p /out && cp -a /opt/spack-buildcache/. /out/
          FROM scratch
          COPY --from=bcread /out/ /
          EOF
          start=$(date +%s)
          DOCKER_BUILDKIT=1 docker buildx build -f export-spack-bc.Dockerfile -o type=local,dest=./bc-export .
          {
            echo "## spack buildcache export"
            echo "- size: $(du -sh bc-export | cut -f1)"
            echo "- export duration: $(( $(date +%s) - start ))s"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: save spack buildcache (host -> actions cache)
        if: always() && inputs.variant == 'spack_2025.2_x86_64'
        uses: actions/cache/save@v4.3.0
        with:
          path: ./bc-export
          # Same key as restore; saving over an existing key only warns and
          # does not fail (partial-payload overwrite is tolerated).
          key: spack-bc-x86_64-${{ hashFiles('dockerfiles/spack/**') }}

      - name: upload spack buildcache artifact (host -> next run's primary channel)
        id: bcupload
        if: always() && inputs.variant == 'spack_2025.2_x86_64'
        uses: actions/upload-artifact@v4
        with:
          # Same name semantics as the actions/cache key: the bundled spack
          # Dockerfile hash stands in for the spack DAG hash.
          name: spack-bc-x86_64-${{ hashFiles('dockerfiles/spack/**') }}
          path: ./bc-export
          # Two consecutive dispatches (incl. a failed retry) stay inside the
          # window (phase-6 plan default 4).
          retention-days: 2

      - name: prune older same-prefix spack buildcache artifacts (previous runs)
        if: always() && inputs.variant == 'spack_2025.2_x86_64' && steps.bcupload.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BC_PREFIX: spack-bc-x86_64-
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          set -uo pipefail
          # v4 artifacts are per-run, so same-name entries from previous runs
          # accumulate: list repo-wide same-prefix artifacts and delete those
          # belonging to any other run. Reached only when this run's upload
          # succeeded (r3 major gate on the upload outcome); a failed prune
          # is logged, not fatal - the retention window is the backstop
          # (phase-6 plan risk 2).
          deleted=0
          page=1
          while :; do
            batch=$(gh api "repos/${GH_REPO}/actions/artifacts?per_page=100&page=${page}" \
              --jq ".artifacts[] | select(.name | startswith(\"${BC_PREFIX}\")) | select((.workflow_run.id | tostring) != \"${CURRENT_RUN}\") | \"\(.id) \(.name)\"" 2>/dev/null || true)
            if [ -z "${batch}" ]; then break; fi
            while read -r aid aname; do
              if [ -z "${aid}" ]; then continue; fi
              echo "prune old-run artifact: ${aname} (id ${aid})"
              if gh api -X DELETE "repos/${GH_REPO}/actions/artifacts/${aid}" 2>/dev/null; then
                deleted=$((deleted + 1))
              else
                echo "warning: prune of artifact ${aid} failed; retention window will expire it" >&2
              fi
            done <<EOF
          ${batch}
          EOF
            page=$((page + 1))
            if [ "${page}" -gt 10 ]; then
              echo "warning: artifact listing exceeded 10 pages; prune sweep stopped" >&2
              break
            fi
          done
          echo "prune done: ${deleted} old-run artifact(s) removed"

      # --- native runner build (no docker) -------------------------------
      # native_* variants (phase-6 Wave 6): build CP2K directly on the runner
      # (the Wave-3 probe proved the full chain on this very image class).
      # No docker image is produced - acceptance is the build exit code, the
      # exe existence assertion and the --version smoke, all hard gates. Only
      # the two cuda=none combinations are offered: a bare runner has no
      # nvcc/CUDA toolkit, so CUDA native e2e stays backlog (plan default 2).
      # mpich is deliberately NOT apt-installed by a workflow step: the
      # product prereq path auto-installs it (Wave 4, plan default 11) and an
      # explicit step here would mask the product behavior this e2e exists to
      # prove. Every docker-side step above (transport ring, docker builds,
      # docker smoke) is gated on the spack/cuda variant conditions and stays
      # skipped for native runs.

      - name: forge2k build -m native -v 2023.2 --cpu $CPU --cuda none
        if: startsWith(inputs.variant, 'native_')
        timeout-minutes: 340
        env:
          # Map the dispatch choice to the forge2k --cpu value (env-indirect
          # style of the cuda mapping above; cuda stays none, so the make
          # arch dir is always "local" for both native choices).
          CPU: ${{ inputs.variant == 'native_2023.2_generic_none' && 'generic' || 'x86_64' }}
        run: |
          # pipefail: the forge2k exit code IS the acceptance gate - tee must
          # not swallow it (same wiring as the toolchain/spack build steps).
          set -o pipefail
          echo "===== DF_CHECKPOINT:native-pre-build at $(date -u +%Y-%m-%dT%H:%M:%SZ) ====="
          df -h /
          start=$(date +%s)
          ./target/debug/forge2k build -m native -v 2023.2 --cpu "$CPU" --cuda none 2>&1 | tee native-build-log.txt
          elapsed=$(( $(date +%s) - start ))
          {
            echo "===== DF_CHECKPOINT:native-post-build at $(date -u +%Y-%m-%dT%H:%M:%SZ) ====="
            df -h /
            echo "NATIVE_BUILD_ELAPSED_SECONDS=${elapsed}"
          } | tee -a native-build-log.txt

      - name: assert native exe exists and is executable (hard gate)
        if: startsWith(inputs.variant, 'native_')
        run: |
          # cuda=none -> the arch dir is always "local" (the arch name tracks
          # cuda, not cpu; the bundled Dockerfiles and the native code
          # agree). A missing or non-executable exe is a hard failure.
          EXE=/opt/cp2k_build/cp2k/exe/local/cp2k.psmp
          echo "===== EXE_ASSERT begin: test -x ${EXE} ====="
          if test -x "${EXE}"; then
            stat -c 'size=%s bytes mode=%A owner=%U:%G' "${EXE}"
            file "${EXE}" || true
            echo "EXE_ASSERT:PASS"
          else
            echo "EXE_ASSERT:FAIL (missing or not executable)" >&2
            echo "--- diagnostics: build dir ---"
            ls -ld /opt/cp2k_build /opt/cp2k_build/cp2k 2>&1 || true
            ls -la /opt/cp2k_build/cp2k/exe/ 2>&1 || true
            ls -la /opt/cp2k_build/cp2k/exe/local/ 2>&1 || true
            echo "--- diagnostics: native-build-log.txt tail ---"
            tail -n 40 native-build-log.txt 2>&1 || true
            exit 1
          fi

      - name: smoke test native exe --version (direct, then toolchain setup fallback; hard gate)
        if: startsWith(inputs.variant, 'native_')
        run: |
          # Hard acceptance gate (plan default 8): pass = a route prints
          # "CP2K" AND exits 0; any other outcome fails the job. Wiring
          # rules (fixing the Wave-3 probe ladder defects): defined absolute
          # paths only - no bare relative paths and no undefined variables
          # (set -u for this script's own wiring); explicit begin/end
          # markers and rc per route; the fallback sources the toolchain
          # install/setup script in THIS shell (it exports PATH and
          # LD_LIBRARY_PATH for the toolchain-prefix shared libs the exe
          # links against) and then retries the same absolute path. timeout
          # 180 guards a pathological hang: a killed run reports rc 124 and
          # can never pass the rc-0 requirement, so it reads as an honest
          # FAIL instead of a hang eating the job budget.
          set -u
          set +e
          EXE=/opt/cp2k_build/cp2k/exe/local/cp2k.psmp
          SETUP=/opt/cp2k_build/cp2k/tools/toolchain/install/setup
          test -x "${EXE}" || { echo "SMOKE_VERDICT:FAIL exe missing or not executable: ${EXE}" >&2; exit 1; }
          # The exe links the runner's system MPICH, whose UCX transport dials
          # InfiniBand and aborts on hosted runners ("ibv_create_srq Operation
          # not supported", probe4 run 38039736230); that abort is what
          # misreads as rc 15 in the fallback route. Pin UCX to loopback/tcp
          # for the version probe; a no-op where UCX is absent.
          export UCX_TLS=tcp,self,sm

          echo "===== SMOKE route=direct begin: ${EXE} --version ====="
          direct_out=$(timeout 180 "${EXE}" --version 2>&1)
          direct_rc=$?
          printf '%s\n' "${direct_out}"
          echo "===== SMOKE route=direct end rc=${direct_rc} ====="
          if [ "${direct_rc}" -eq 0 ] && printf '%s\n' "${direct_out}" | grep -q "CP2K"; then
            echo "SMOKE_VERDICT:PASS route=direct rc=0"
            exit 0
          fi

          echo "===== SMOKE route=setup-fallback begin: source ${SETUP}; retry ${EXE} --version ====="
          if [ ! -f "${SETUP}" ]; then
            echo "SMOKE_VERDICT:FAIL setup script missing: ${SETUP} (direct rc=${direct_rc})" >&2
            exit 1
          fi
          # Source the toolchain env in THIS shell so the retry below
          # inherits the exported PATH/LD_LIBRARY_PATH; -u is relaxed around
          # the third-party script (its own variable discipline is not ours
          # to guarantee), then restored for the rest of the ladder.
          set +u
          source "${SETUP}"
          source_rc=$?
          set -u
          # Re-assert explicit rc control: a sourced third-party script may
          # have enabled errexit in this shell, which would abort the ladder
          # before the verdict markers print.
          set +e
          echo "===== SMOKE source ${SETUP} rc=${source_rc} ====="
          if [ "${source_rc}" -ne 0 ]; then
            echo "SMOKE_VERDICT:FAIL source rc=${source_rc} (direct rc=${direct_rc})" >&2
            exit 1
          fi
          fallback_out=$(timeout 180 "${EXE}" --version 2>&1)
          fallback_rc=$?
          printf '%s\n' "${fallback_out}"
          echo "===== SMOKE route=setup-fallback end rc=${fallback_rc} ====="
          if [ "${fallback_rc}" -eq 0 ] && printf '%s\n' "${fallback_out}" | grep -q "CP2K"; then
            echo "SMOKE_VERDICT:PASS route=setup-fallback rc=0"
            exit 0
          fi

          echo "SMOKE_VERDICT:FAIL both routes (direct rc=${direct_rc}, setup-fallback rc=${fallback_rc})" >&2
          exit 1

      - name: native evidence transcript (df + log tail; tolerant, never fails)
        if: always() && startsWith(inputs.variant, 'native_')
        run: |
          # Tolerant reporting only (plan risk 4/5): on a failed or aborted
          # build this still records the disk state and the log tail so the
          # evidence reading does not depend on the build step surviving.
          echo "===== DF_CHECKPOINT:native-post-job at $(date -u +%Y-%m-%dT%H:%M:%SZ) ====="
          df -h /
          ls -l /opt/cp2k_build/cp2k/exe/local/ 2>&1 || true
          echo "===== native-build-log.txt tail ====="
          tail -n 20 native-build-log.txt 2>&1 || true

      - name: upload native build log
        if: always() && startsWith(inputs.variant, 'native_')
        uses: actions/upload-artifact@v4
        with:
          # Per-variant name (same convention as the build-log upload
          # below); retention matches the transport window (phase-6 plan
          # default 4).
          name: native-build-log-${{ inputs.variant }}
          path: native-build-log.txt
          retention-days: 2

      - name: upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ inputs.variant }}
          path: build-log.txt
