name: probe base2404 (TEMPORARY, wave deepmd-revival)

# TEMPORARY probe artifact, not part of the product surface.
#
# Question (wave deepmd-revival, probe-24.04): the deepmd feature variant of
# the 2026.2 toolchain image (cp2k/cp2k:2026.2_mpich_generic_psmp_deepmd)
# SIGSEGVs at compute time (rc=139) in the produced ubuntu:22.04 image (e2e
# runs 38682037203 / 38707255454: identical crash point in both rounds, after
# the DeePMD model loads; the two-round matrix already closed CXX11 ABI,
# thread env and the duplicate-libgomp hypothesis). The remaining main
# candidate is a RUNTIME interaction between the OFFICIAL libtorch 2.7.1
# prebuilt binary (libtorch-cxx11-abi-shared-with-deps-2.7.1+cpu.zip - the
# same archive upstream installs on every distro) and the ubuntu:22.04
# runtime. Upstream never validates this combination on 22.04: its own
# toolchain regtest containers are FROM ubuntu:26.04
# (tools/docker/generate_dockerfiles.py, install_deps_toolchain default),
# while this image is pinned to 22.04. Hypothesis under test: aligning the
# BASE IMAGE with the newer system upstream validates removes the SIGSEGV.
#
# Method (single variable, generator untouched): render the product
# Dockerfile unchanged (--generate-only), swap ONLY the base image
# (ubuntu:22.04 -> ubuntu:24.04, both stages) and the apt cache-mount id
# (apt-2204 -> apt-2404, so a 22.04 package cache can never mix into the
# 24.04 build), then docker build + run the deepmd-water test. No toolchain
# hack is injected: the feasibility check (gh api of
# tools/toolchain/install_cp2k_toolchain.sh and install_requirements*.sh @
# support/v2026.2) found NO distro/version gate to work around - no
# lsb_release / /etc/os-release / jammy|noble logic anywhere in the install
# path; install_requirements.sh dispatches on the base-image family string
# ("*ubuntu*") only, and install_cp2k_toolchain.sh contains no distro branch
# at all. 24.04 is inside upstream's own supported set (their generators
# emit ubuntu:24.04 and ubuntu:26.04 toolchain images).
#
# Trigger: `push: branches: [probe/base2404]`. A workflow_dispatch entry
# cannot be used here: the dispatch UI/API only lists workflows that exist on
# the DEFAULT branch, so an unmerged probe file is not dispatchable; a scoped
# push trigger on a throwaway branch is the established workaround (same
# pattern as the removed phase-6/phase-7 probes). The authoring commit does
# NOT push and does NOT dispatch - the main agent owns both.
#
# Verdict semantics (read PROBE_VERDICT in the summary; the raw markers in
# the log are the evidence, the matrix is a mechanical roll-up):
#   PASS_2404                  -> hypothesis holds: after aligning the base
#                                 image with the newer system upstream
#                                 validates, deepmd-water computes AND
#                                 terminates; 24.04 becomes the alignment
#                                 target for the next wave.
#   FAIL_2404 + IDENTICAL_TAIL -> falsified: the base image is not the
#                                 variable; the deepmd-kit 3.1.0 + libtorch
#                                 2.7.1 combination stays the candidate.
#   FAIL_2404 + DIFFERS_TAIL   -> new information: the crash point MOVED;
#                                 inspect crash-tail.diff and re-scope.
#   BUILD_FAIL_ON_2404         -> new information: the toolchain install
#                                 itself does not build on 24.04 with this
#                                 render (see docker-build.log); next
#                                 candidate: 26.04 (upstream's own surface).
#   IMAGE_FLAG_GATE_FAIL       -> unexpected: the built image lost its
#                                 deepmd/libtorch tokens (build or cmake
#                                 resolution problem); no run is judged.
# The extra mpirun runs and the previous-round tail diff are EVIDENCE
# enrichment only: the probe criterion is the task command (plain cp2k,
# -o probe.out): rc=0 + an ENERGY line + PROGRAM ENDED.
# DELETE this workflow (and the probe/base2404 branch) once the evidence is
# recorded.

on:
  push:
    branches: [probe/base2404]

# contents: the checkout; actions: read is for the previous-round log fetch
# on the crash path (read-only, no writes anywhere).
permissions:
  contents: read
  actions: read

# Two pushes of the same branch must not race two multi-hour image builds.
concurrency:
  group: probe-base2404
  cancel-in-progress: false

jobs:
  probe-base2404:
    name: deepmd 2026.2 image on base2404 (render -> sed -> build -> run)
    runs-on: ubuntu-latest
    # Same arithmetic as the e2e toolchain_2026.2_generic_deepmd variant (a
    # 1.5-3h toolchain build on 4 cores under a 350 min job cap); the probe
    # adds only minutes-scale runs and evidence steps.
    timeout-minutes: 355
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo build (debug binary drives the Dockerfile render)
        run: cargo build

      # ---- render + single-variable base-image swap (hard gate) ----------
      # The swap assertions are exact counts, not presence checks: a silent
      # no-op sed (0 replacements) or a partial swap would fake a "24.04 did
      # not help" verdict, which is the one reading this probe exists to
      # avoid. Expected render (verified locally against this commit): two
      # 'FROM ubuntu:22.04' lines (build + install stage) and two
      # 'id=apt-2204' cache mounts.
      - name: "render: forge2k --generate-only + base2404 swap + swap assertions"
        id: render
        run: |
          set -uo pipefail
          rc=0
          set +e
          ./target/debug/forge2k build -m toolchain -v 2026.2 --cpu generic --cuda none \
            --features deepmd --generate-only 2>&1 | tee render.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "${rc}" -ne 0 ]; then
            echo "RENDER_VERDICT:FAIL (generate-only rc=${rc})" | tee render-facts.txt
            exit 1
          fi
          DF="$(sed -n 's/^Generated Dockerfile: //p' render.log | head -n 1 | tr -d '\r')"
          echo "RENDERED_DOCKERFILE=${DF}"
          if [ -z "${DF}" ] || [ ! -f "${DF}" ]; then
            echo "RENDER_VERDICT:FAIL (no rendered Dockerfile at '${DF}')" | tee render-facts.txt
            exit 1
          fi
          cp "${DF}" probe-2404.Dockerfile.orig
          pre_from=$(grep -c '^FROM ubuntu:22\.04' probe-2404.Dockerfile.orig || true)
          pre_apt=$(grep -c 'id=apt-2204' probe-2404.Dockerfile.orig || true)
          echo "PRE_SWAP from_2204=${pre_from} apt_2204=${pre_apt}"
          if [ "${pre_from}" -ne 2 ] || [ "${pre_apt}" -ne 2 ]; then
            echo "RENDER_VERDICT:FAIL (expected 2 'FROM ubuntu:22.04' + 2 'apt-2204' in the pristine render, got ${pre_from}/${pre_apt}; render changed - re-read it before trusting any swap)" | tee render-facts.txt
            exit 1
          fi
          sed -e 's|ubuntu:22\.04|ubuntu:24.04|g' -e 's|apt-2204|apt-2404|g' \
            probe-2404.Dockerfile.orig > "${DF}"
          cp "${DF}" probe-2404.Dockerfile
          post_from=$(grep -c '^FROM ubuntu:24\.04' "${DF}" || true)
          post_apt=$(grep -c 'id=apt-2404' "${DF}" || true)
          leftovers=$(grep -c '22\.04\|2204' "${DF}" || true)
          echo "POST_SWAP from_2404=${post_from} apt_2404=${post_apt} leftovers_2204=${leftovers}"
          sha256sum probe-2404.Dockerfile.orig probe-2404.Dockerfile | tee render-sha256.txt
          diff -u probe-2404.Dockerfile.orig probe-2404.Dockerfile > sed.diff || true
          echo "===== SED_DIFF begin ====="
          cat sed.diff
          echo "===== SED_DIFF end ====="
          {
            echo "RENDER_VERDICT:PASS"
            echo "DOCKERFILE=${DF}"
            echo "PRE_FROM_2204=${pre_from}"
            echo "PRE_APT_2204=${pre_apt}"
            echo "POST_FROM_2404=${post_from}"
            echo "POST_APT_2404=${post_apt}"
            echo "LEFTOVERS_2204=${leftovers}"
          } | tee render-facts.txt
          if [ "${post_from}" -ne 2 ] || [ "${post_apt}" -ne 2 ] || [ "${leftovers}" -ne 0 ]; then
            echo "RENDER_VERDICT:FAIL (post-swap assertions: from_2404=${post_from} apt_2404=${post_apt} leftovers=${leftovers})" >&2
            exit 1
          fi
          echo "RENDER_VERDICT:PASS (exact single-variable swap: 2x base image, 2x apt cache id, 0 leftovers)"

      # ---- docker build of the swapped render (hard gate) ----------------
      # Context is the rendered Dockerfile's own directory, exactly like
      # forge2k's build_docker_args (context = dockerfile.parent()); the
      # Dockerfile copies nothing from the context, so the context content is
      # irrelevant - the path is kept identical for fidelity. NUM_PROCS is
      # passed as the task wiring specifies; note the template declares no
      # ARG NUM_PROCS, so the effective -j is the shell default 8 on a 4-core
      # runner - identical to what the e2e deepmd build does, so the probe
      # introduces no new build-time variable.
      - name: "docker build probe/cp2k:2404 from the base2404 render (hard gate)"
        id: build
        timeout-minutes: 320
        run: |
          set -o pipefail
          export DOCKER_BUILDKIT=1
          DF="$(sed -n 's/^DOCKERFILE=//p' render-facts.txt | head -n 1)"
          if [ -z "${DF}" ] || [ ! -f "${DF}" ]; then
            echo "BUILD_VERDICT:FAIL (rendered Dockerfile path missing: '${DF}')" | tee build-verdict.txt
            exit 1
          fi
          # Context = the rendered Dockerfile's own directory: exactly what
          # forge2k's build_docker_args uses (context = dockerfile.parent()).
          DF_DIR="$(dirname "${DF}")"
          echo "BUILD_CONTEXT=${DF_DIR}"
          a=$(sha256sum "${DF}" | cut -d' ' -f1)
          b=$(sha256sum probe-2404.Dockerfile | cut -d' ' -f1)
          echo "SHA_BUILD_FROM=${a} SHA_WORKSPACE_COPY=${b}"
          if [ "${a}" != "${b}" ]; then
            echo "BUILD_VERDICT:FAIL (sha256 mismatch between the build input and the workspace copy)" | tee build-verdict.txt
            exit 1
          fi
          echo "===== DF_CHECKPOINT:build-pre at $(date -u +%Y-%m-%dT%H:%M:%SZ) ====="
          df -h /
          rc=0
          start=$(date +%s)
          set +e
          docker build --shm-size 1g --progress=plain \
            -f "${DF}" \
            -t probe/cp2k:2404 \
            --build-arg NUM_PROCS=4 \
            "${DF_DIR}" 2>&1 | tee docker-build.log
          rc=${PIPESTATUS[0]}
          set -e
          elapsed=$(( $(date +%s) - start ))
          echo "===== DF_CHECKPOINT:build-post at $(date -u +%Y-%m-%dT%H:%M:%SZ) ====="
          df -h /
          echo "DOCKER_BUILD_RC=${rc} DOCKER_BUILD_ELAPSED_SECONDS=${elapsed}"
          if [ "${rc}" -ne 0 ]; then
            {
              echo "BUILD_VERDICT:FAIL"
              echo "BUILD_DETAIL: docker build rc=${rc}"
            } | tee build-verdict.txt
            echo "===== BUILD_LOG_TAIL begin (last 60 lines) ====="
            tail -n 60 docker-build.log
            echo "===== BUILD_LOG_TAIL end ====="
            echo "BUILD_FAIL_NOTE=the 24.04 toolchain build itself failed; inspect docker-build.log (component/stage) - this is 'new information' towards 26.04/upstream-flow alignment, NOT a crash-point verdict"
            exit 1
          fi
          {
            echo "BUILD_VERDICT:PASS"
            echo "DOCKER_BUILD_ELAPSED_SECONDS=${elapsed}"
          } | tee build-verdict.txt

      # ---- gate 1: the image really carries deepmd + libtorch ------------
      # Mirrors the e2e hard gate verbatim: a green version probe without the
      # tokens means the build lost the feature and any run result would be
      # unreadable.
      - name: "gate 1: cp2k --version + cp2kflags deepmd/libtorch tokens (hard gate)"
        id: flags
        if: steps.build.outcome == 'success'
        run: |
          set -o pipefail
          rc=0
          set +e
          docker run --rm probe/cp2k:2404 cp2k --version 2>&1 | tee cp2k-version.txt
          rc=${PIPESTATUS[0]}
          set -e
          if [ "${rc}" -ne 0 ]; then
            echo "FLAGS_VERDICT:FAIL (cp2k --version rc=${rc})" | tee flags-verdict.txt
            exit 1
          fi
          fail=0
          grep -q 'CP2K version 2026.2' cp2k-version.txt || fail=1
          grep -Eq 'cp2kflags:.*(^| )deepmd( |$)' cp2k-version.txt || fail=1
          grep -Eq 'cp2kflags:.*(^| )libtorch( |$)' cp2k-version.txt || fail=1
          if [ "${fail}" -ne 0 ]; then
            {
              echo "FLAGS_VERDICT:FAIL"
              echo "FLAGS_DETAIL: version/cp2kflags token missing; see cp2k-version.txt"
            } | tee flags-verdict.txt
            exit 1
          fi
          {
            echo "FLAGS_VERDICT:PASS"
            echo "FLAGS_DETAIL: 2026.2 + deepmd + libtorch tokens present on base2404"
          } | tee flags-verdict.txt

      # ---- environment facts: WHAT actually changed vs the 22.04 image ----
      # The hypothesis is about the libtorch binary <-> runtime interaction,
      # so the runtime itself (glibc/libstdc++/libgomp versions) and the ldd
      # resolution of the deepmd path are the dependent-variable evidence.
      # Informational only: never fails the probe.
      - name: environment facts (glibc/libstdc++/libgomp + ldd resolution; informational)
        id: envfacts
        if: steps.build.outcome == 'success'
        run: |
          set +e
          docker run --rm probe/cp2k:2404 bash -c '
          set -u
          echo "os: $(grep PRETTY_NAME /etc/os-release)"
          echo "glibc: $(ldd --version | head -n 1)"
          echo "libc6: $(dpkg -s libc6 2>/dev/null | grep ^Version || true)"
          echo "libstdc++6: $(dpkg -s libstdc++6 2>/dev/null | grep ^Version || true)"
          echo "libgomp1: $(dpkg -s libgomp1 2>/dev/null | grep ^Version || true)"
          echo "gcc: $(g++ --version 2>/dev/null | head -n 1 || true)"
          echo "===== LDD_GOMP_TORCH begin ====="
          ldd /opt/cp2k/install/bin/cp2k.psmp | grep -E "gomp|torch|deepmd|stdc\+\+" || true
          echo "===== LDD_GOMP_TORCH end ====="
          echo "===== TOOLCHAIN_ML_DIRS begin ====="
          find /opt/cp2k/tools/toolchain/install -maxdepth 2 \( -name "libtorch*" -o -name "deepmd*" -o -name "DeePMD*" \) -printf "%p\n" 2>/dev/null | head -n 20 || true
          echo "===== TOOLCHAIN_ML_DIRS end ====="
          ' 2>&1 | tee env-facts.txt
          env_rc=${PIPESTATUS[0]}
          echo "ENV_FACTS_VERDICT:$([ "${env_rc}" -eq 0 ] && echo PASS || echo INCOMPLETE_rc=${env_rc})" | tee -a env-facts.txt
          exit 0

      # ---- the probe criterion: deepmd-water on the base2404 image -------
      # Primary run = the task command (plain cp2k, single rank, -o probe.out);
      # criterion = rc=0 AND an ENERGY line AND PROGRAM ENDED. The mpirun runs
      # reuse the e2e harness for a like-for-like comparison with the recorded
      # crash point; np2 (rank invariance) only runs when the primary passed.
      - name: "functional runs: deepmd-water on base2404 (criterion: rc=0 + ENERGY + PROGRAM ENDED)"
        id: run
        if: steps.build.outcome == 'success'
        timeout-minutes: 20
        run: |
          set -uo pipefail
          OUT_DIR="$PWD/ci/cp2k-tests"
          rc=0
          set +e
          echo "===== PROBE RUN begin: plain cp2k, np1 singleton (task command) ====="
          docker run --rm --shm-size=1g \
            -v "${OUT_DIR}:/work" -w /work \
            probe/cp2k:2404 \
            bash -c "cp2k -i deepmd-water.inp -o probe.out" 2>&1 | tee run-console.log
          rc=$?
          set -e
          echo "===== PROBE RUN end: rc=${rc} ====="

          mpi_rc=0
          set +e
          echo "===== EXTRA RUN begin: mpirun -np 1 (e2e comparability) ====="
          docker run --rm --shm-size=1g \
            -v "${OUT_DIR}:/work" -w /work \
            probe/cp2k:2404 \
            bash -c "mpirun -np 1 cp2k -i deepmd-water.inp -o probe-mpi-np1.out" 2>&1 | tee mpi-np1-console.log
          mpi_rc=$?
          set -e
          echo "===== EXTRA RUN end: rc=${mpi_rc} ====="

          np2_rc=NA
          if [ "${rc}" -eq 0 ]; then
            set +e
            echo "===== EXTRA RUN begin: mpirun -np 2 (rank invariance; primary PASS only) ====="
            docker run --rm --shm-size=1g \
              -v "${OUT_DIR}:/work" -w /work \
              probe/cp2k:2404 \
              bash -c "mpirun -np 2 cp2k -i deepmd-water.inp -o probe-mpi-np2.out" 2>&1 | tee mpi-np2-console.log
            np2_rc=$?
            set -e
            echo "===== EXTRA RUN end: rc=${np2_rc} ====="
          fi

          # ---- primary-output evidence -----------------------------------
          OUT="${OUT_DIR}/probe.out"
          energy_count=0
          strict_energy_count=0
          ended_count=0
          bytes=0
          lines=0
          last_energy=""
          if [ -f "${OUT}" ]; then
            energy_count=$(grep -c 'ENERGY|' "${OUT}" || true)
            strict_energy_count=$(grep -c 'ENERGY| Total FORCE_EVAL' "${OUT}" || true)
            ended_count=$(grep -c 'PROGRAM ENDED' "${OUT}" || true)
            bytes=$(wc -c < "${OUT}")
            lines=$(wc -l < "${OUT}" | tr -d ' ')
            last_energy=$(grep -E '^[[:space:]]*ENERGY\| Total FORCE_EVAL' "${OUT}" | tail -n 1 || true)
          else
            echo "PROBE_OUT:missing (${OUT})"
          fi
          mpi_energy_count=0
          mpi_ended_count=0
          if [ -f "${OUT_DIR}/probe-mpi-np1.out" ]; then
            mpi_energy_count=$(grep -c 'ENERGY|' "${OUT_DIR}/probe-mpi-np1.out" || true)
            mpi_ended_count=$(grep -c 'PROGRAM ENDED' "${OUT_DIR}/probe-mpi-np1.out" || true)
          fi
          echo "===== RUN_FACTS ====="
          echo "rc=${rc} mpi_np1_rc=${mpi_rc} mpi_np2_rc=${np2_rc}"
          echo "probe.out: bytes=${bytes} lines=${lines} energy_lines=${energy_count} strict_energy_lines=${strict_energy_count} program_ended=${ended_count}"
          echo "last_energy_line: ${last_energy}"
          echo "probe-mpi-np1.out: energy_lines=${mpi_energy_count} program_ended=${mpi_ended_count}"
          echo "===== RUN_TAIL begin (last 40 lines of probe.out) ====="
          tail -n 40 "${OUT}" 2>/dev/null || true
          echo "===== RUN_TAIL end ====="
          echo "===== CONSOLE_TAIL begin (last 30 lines of the primary console) ====="
          tail -n 30 run-console.log || true
          echo "===== CONSOLE_TAIL end ====="
          echo "===== MPI_NP1_CONSOLE_TAIL begin (last 30 lines) ====="
          tail -n 30 mpi-np1-console.log || true
          echo "===== MPI_NP1_CONSOLE_TAIL end ====="
          echo "===== STAGE_MARKERS begin (last 20 marker lines of probe.out) ====="
          grep -nE 'DeePMD|DEEPMD|NONBONDED|FORCE_EVAL|ABORT|ERROR' "${OUT}" 2>/dev/null | tail -n 20 || true
          echo "===== STAGE_MARKERS end ====="

          mpi_verdict=FAIL
          if [ "${mpi_rc}" -eq 0 ] && [ "${mpi_energy_count}" -ge 1 ] && [ "${mpi_ended_count}" -ge 1 ]; then
            mpi_verdict=PASS
          fi
          np2_verdict=SKIP
          if [ "${np2_rc}" != "NA" ]; then
            np2_verdict=FAIL
            if [ "${np2_rc}" -eq 0 ]; then
              np2_verdict=PASS
            fi
          fi
          if [ "${rc}" -eq 0 ] && [ "${energy_count}" -ge 1 ] && [ "${ended_count}" -ge 1 ]; then
            run_verdict=PASS
          else
            run_verdict=FAIL
          fi
          {
            echo "RC=${rc}"
            echo "MPI_NP1_RC=${mpi_rc}"
            echo "MPI_NP2_RC=${np2_rc}"
            echo "ENERGY_COUNT=${energy_count}"
            echo "STRICT_ENERGY_COUNT=${strict_energy_count}"
            echo "ENDED_COUNT=${ended_count}"
            echo "LAST_ENERGY=${last_energy}"
            echo "PROBE_OUT_BYTES=${bytes}"
            echo "PROBE_OUT_LINES=${lines}"
            echo "MPI_NP1_ENERGY_COUNT=${mpi_energy_count}"
            echo "MPI_NP1_ENDED_COUNT=${mpi_ended_count}"
            echo "RUN_VERDICT:${run_verdict}"
            echo "MPI_NP1_VERDICT:${mpi_verdict}"
            echo "MPI_NP2_VERDICT:${np2_verdict}"
          } | tee run-facts.txt
          if [ "${run_verdict}" != "PASS" ]; then
            echo "RUN_VERDICT_DETAIL: rc=${rc} energy_lines=${energy_count} program_ended=${ended_count} (probe criterion not met)" >&2
            exit 1
          fi
          echo "RUN_VERDICT_DETAIL: probe criterion met (rc=0, ENERGY present, PROGRAM ENDED present)"

      # ---- pinned-reference check (informational) ------------------------
      # The probe criterion is the triple above; the upstream pin
      # (-17.266752586704772 +- 1e-6, TEST_FILES.toml matcher M011) is a
      # quantitative bonus: a PASS with PIN_VERDICT:MISMATCH means the run
      # works but computes a different number (build-env delta), which is its
      # own finding and must not be conflated with the crash question.
      - name: "pinned reference check (informational; upstream ref +- 1e-6)"
        id: pin
        if: steps.run.outcome == 'success'
        run: |
          set +e
          RC=$(sed -n 's/^RC=//p' run-facts.txt | head -n 1)
          bash ci/cp2k-tests/assert_cp2k_output.sh "ci/cp2k-tests/probe.out" deepmd-water "${RC}" 2>&1 | tee pin-assert.log
          arc=${PIPESTATUS[0]}
          set -e
          if [ "${arc}" -eq 0 ]; then
            {
              echo "PIN_VERDICT:PASS"
              echo "PIN_DETAIL: energy within the upstream pin tolerance"
            } | tee pin-verdict.txt
          else
            {
              echo "PIN_VERDICT:MISMATCH"
              echo "PIN_DETAIL: value outside the upstream pin; the run still satisfies the probe triple - separate finding, see pin-assert.log"
            } | tee pin-verdict.txt
          fi
          exit 0

      # ---- previous-round crash tail + diff (informational) --------------
      # The recorded crash point was compared across rounds from the docker
      # run console in the job log ("byte-identical", same text: the MPICH
      # SIGSEGV handler block with the address-only backtrace). This step
      # mechanizes that comparison: fetch the round-2 log (38707255454),
      # extract the deepmd functional step's np1 console lines, extract this
      # run's mpirun-np1 console section, NORMALIZE the volatile parts (gh log
      # timestamp prefix; ASLR addresses 0x...; the MPICH 'PID <n> RUNNING AT
      # <host>' line - all three differ run to run and would otherwise fake a
      # DIFFERS verdict), then diff. Always exit 0 - a fetch problem degrades
      # to UNAVAILABLE, never to a fake verdict.
      # gh run view --log row format (verified against the real run): three
      # tab-separated fields job<TAB>step<TAB>timestamp[+space]message, with
      # a UTF-8 BOM on the first row of a step.
      - name: "previous-round crash tail + diff (informational; run 38707255454)"
        id: prevtail
        if: always() && steps.run.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set +e
          prev_run=38707255454
          normalize() {
            sed -e 's/0x[0-9a-fA-F]*/0xADDR/g' \
                -e 's/PID [0-9][0-9]* RUNNING AT [0-9a-fA-F]*/PID <n> RUNNING AT <host>/g'
          }
          gh run view "${prev_run}" --log > prev-run.log 2>prev-run.err
          fetch_rc=$?
          echo "PREV_FETCH_RC=${fetch_rc} (run ${prev_run}, log lines: $(wc -l < prev-run.log 2>/dev/null || echo 0))"
          if [ "${fetch_rc}" -ne 0 ]; then
            head -n 20 prev-run.err || true
            {
              echo "CRASH_POINT_COMPARISON:UNAVAILABLE"
              echo "COMPARISON_DETAIL: previous run log fetch failed; compare manually against the e2e run log"
            } | tee prev-tail-verdict.txt
            exit 0
          fi
          awk -F'\t' '$2 ~ /functional test: deepmd water/ { sub(/^([^\t]*\t){2}/, ""); sub(/^\xef\xbb\xbf/, ""); sub(/^[0-9][0-9-]*T[0-9:.]+Z /, ""); print }' prev-run.log > prev-step.log
          echo "PREV_STEP_LINES=$(wc -l < prev-step.log | tr -d ' ')"
          awk '/FUNCTIONAL run begin: deepmd-water-np1/{f=1; next} /FUNCTIONAL run end: deepmd-water-np1/{f=0} f' prev-step.log > prev-np1-section.log
          echo "PREV_NP1_SECTION_LINES=$(wc -l < prev-np1-section.log | tr -d ' ')"
          awk '/EXTRA RUN begin: mpirun -np 1/{f=1; next} /EXTRA RUN end:/{f=0} f' mpi-np1-console.log > cur-np1-section.log
          echo "CUR_NP1_SECTION_LINES=$(wc -l < cur-np1-section.log | tr -d ' ')"
          tail -n 25 prev-np1-section.log > prev-crash-tail.txt
          tail -n 25 cur-np1-section.log > cur-crash-tail.txt
          normalize < prev-crash-tail.txt > prev-crash-tail.norm
          normalize < cur-crash-tail.txt > cur-crash-tail.norm
          if [ ! -s prev-crash-tail.txt ]; then
            {
              echo "CRASH_POINT_COMPARISON:UNAVAILABLE"
              echo "COMPARISON_DETAIL: previous tail extraction empty - awk pattern/format miss; compare manually"
            } | tee prev-tail-verdict.txt
            exit 0
          fi
          if [ ! -s cur-crash-tail.txt ]; then
            {
              echo "CRASH_POINT_COMPARISON:UNAVAILABLE"
              echo "COMPARISON_DETAIL: current tail extraction empty - mpirun-np1 console section empty"
            } | tee prev-tail-verdict.txt
            exit 0
          fi
          if diff -u prev-crash-tail.norm cur-crash-tail.norm > crash-tail.diff 2>&1; then
            {
              echo "CRASH_POINT_COMPARISON:IDENTICAL_TAIL"
              echo "COMPARISON_DETAIL: last 25 normalized console lines match the previous round -> same crash point -> base image FALSIFIED as the variable"
            } | tee prev-tail-verdict.txt
          else
            {
              echo "CRASH_POINT_COMPARISON:DIFFERS_TAIL"
              echo "COMPARISON_DETAIL: normalized crash tails differ from the previous round -> new information; inspect crash-tail.diff"
            } | tee prev-tail-verdict.txt
          fi
          echo "===== CRASH_TAIL_DIFF begin (normalized) ====="
          cat crash-tail.diff
          echo "===== CRASH_TAIL_DIFF end ====="
          echo "===== PREV_CRASH_TAIL begin (raw) ====="
          cat prev-crash-tail.txt
          echo "===== PREV_CRASH_TAIL end ====="
          echo "===== CUR_CRASH_TAIL begin (raw) ====="
          cat cur-crash-tail.txt
          echo "===== CUR_CRASH_TAIL end ====="
          exit 0

      # ---- verdict matrix (always; never fails the job) ------------------
      - name: probe verdict matrix (summary; never fails)
        if: always()
        env:
          RENDER_OUTCOME: ${{ steps.render.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          FLAGS_OUTCOME: ${{ steps.flags.outcome }}
          ENVFACTS_OUTCOME: ${{ steps.envfacts.outcome }}
          RUN_OUTCOME: ${{ steps.run.outcome }}
          PIN_OUTCOME: ${{ steps.pin.outcome }}
          PREVTAIL_OUTCOME: ${{ steps.prevtail.outcome }}
        run: |
          set -uo pipefail
          echo "===== PROBE FACT FILES ====="
          for f in render-facts.txt build-verdict.txt flags-verdict.txt env-facts.txt run-facts.txt pin-verdict.txt prev-tail-verdict.txt; do
            if [ -f "$f" ]; then
              echo "----- ${f} -----"
              cat "$f"
            fi || true
          done
          echo "===== STEP OUTCOMES ====="
          printf 'render=%s\nbuild=%s\nflags=%s\nenvfacts=%s\nrun(primary)=%s\npin=%s\nprevtail=%s\n' \
            "${RENDER_OUTCOME}" "${BUILD_OUTCOME}" "${FLAGS_OUTCOME}" "${ENVFACTS_OUTCOME}" "${RUN_OUTCOME}" "${PIN_OUTCOME}" "${PREVTAIL_OUTCOME}"

          # Token extraction is bare-value only (grep -oE '^TOKEN:[A-Za-z_]+'):
          # every verdict file carries exactly one bare token line plus a
          # '_DETAIL:' annotation line, so an annotated token can never break
          # the equality checks below.
          build_v="$(grep -oE '^BUILD_VERDICT:[A-Za-z_]+' build-verdict.txt 2>/dev/null | head -n 1 || true)"
          flags_v="$(grep -oE '^FLAGS_VERDICT:[A-Za-z_]+' flags-verdict.txt 2>/dev/null | head -n 1 || true)"
          run_v="$(grep -oE '^RUN_VERDICT:[A-Za-z_]+' run-facts.txt 2>/dev/null | head -n 1 || true)"
          mpi_v="$(grep -oE '^MPI_NP1_VERDICT:[A-Za-z_]+' run-facts.txt 2>/dev/null | head -n 1 || true)"
          np2_v="$(grep -oE '^MPI_NP2_VERDICT:[A-Za-z_]+' run-facts.txt 2>/dev/null | head -n 1 || true)"
          pin_v="$(grep -oE '^PIN_VERDICT:[A-Za-z_]+' pin-verdict.txt 2>/dev/null | head -n 1 || true)"
          cmp_v="$(grep -oE '^CRASH_POINT_COMPARISON:[A-Za-z_]+' prev-tail-verdict.txt 2>/dev/null | head -n 1 || true)"
          rc_v="$(sed -n 's/^RC=//p' run-facts.txt 2>/dev/null | head -n 1 || true)"

          if [ "${build_v}" != "BUILD_VERDICT:PASS" ]; then
            verdict="BUILD_FAIL_ON_2404"
            reading="the 24.04 toolchain build itself failed (see docker-build.log): NEW INFORMATION - next candidate is 26.04 (upstream's own surface) or aligning the install flow with upstream's staged install_requirements flow"
          elif [ "${flags_v}" != "FLAGS_VERDICT:PASS" ]; then
            verdict="IMAGE_FLAG_GATE_FAIL"
            reading="the built image lacks the deepmd/libtorch tokens (see cp2k-version.txt): the hypothesis is NOT judged this round"
          elif [ "${run_v}" = "RUN_VERDICT:PASS" ]; then
            verdict="PASS_2404"
            reading="HYPOTHESIS HOLDS: deepmd-water computes and terminates on the 24.04-aligned image; secondary tokens ${pin_v:-PIN_VERDICT:SKIP} ${mpi_v:-MPI_NP1_VERDICT:SKIP} ${np2_v:-MPI_NP2_VERDICT:SKIP} (report any secondary that is not PASS - a non-PASS mpirun token makes the primary PASS suspect)"
          else
            verdict="FAIL_2404"
            reading="rc=${rc_v:-NA} - still failing at compute time; same-vs-new crash point via ${cmp_v:-CRASH_POINT_COMPARISON:UNAVAILABLE}: IDENTICAL_TAIL=FALSIFIED (base image is not the variable), DIFFERS_TAIL=NEW INFORMATION (crash point moved)"
          fi
          {
            echo "PROBE_VERDICT: ${verdict}"
            echo "READING: ${reading}"
            echo "TOKENS: ${build_v:-BUILD_VERDICT:ABSENT} | ${flags_v:-FLAGS_VERDICT:ABSENT} | ${run_v:-RUN_VERDICT:ABSENT} | ${mpi_v:-MPI_NP1_VERDICT:ABSENT} | ${np2_v:-MPI_NP2_VERDICT:ABSENT} | ${pin_v:-PIN_VERDICT:ABSENT} | ${cmp_v:-CRASH_POINT_COMPARISON:ABSENT}"
            echo "===== READING RULE (pre-registered) ====="
            echo "PASS_2404                  -> hypothesis holds (22.04 runtime alignment was the blocker)"
            echo "FAIL_2404 + IDENTICAL_TAIL -> falsified (base image is not the variable)"
            echo "FAIL_2404 + DIFFERS_TAIL   -> new information (crash point moved; inspect crash-tail.diff)"
            echo "BUILD_FAIL_ON_2404         -> new information (24.04 build failed; see docker-build.log)"
            echo "IMAGE_FLAG_GATE_FAIL       -> image lost deepmd/libtorch tokens; no run judged"
          } | tee probe-verdict.txt
          cat probe-verdict.txt >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          exit 0

      - name: upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-base2404-evidence
          path: |
            probe-2404.Dockerfile.orig
            probe-2404.Dockerfile
            sed.diff
            render.log
            render-facts.txt
            render-sha256.txt
            docker-build.log
            build-verdict.txt
            cp2k-version.txt
            flags-verdict.txt
            env-facts.txt
            run-console.log
            mpi-np1-console.log
            mpi-np2-console.log
            run-facts.txt
            pin-assert.log
            pin-verdict.txt
            prev-crash-tail.txt
            cur-crash-tail.txt
            prev-crash-tail.norm
            cur-crash-tail.norm
            prev-np1-section.log
            cur-np1-section.log
            crash-tail.diff
            prev-tail-verdict.txt
            probe-verdict.txt
            ci/cp2k-tests/probe.out
            ci/cp2k-tests/probe-mpi-np1.out
            ci/cp2k-tests/probe-mpi-np2.out
          if-no-files-found: ignore
          retention-days: 7
