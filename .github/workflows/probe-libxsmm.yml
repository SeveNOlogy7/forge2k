name: probe-libxsmm (TEMPORARY, wave deepmd-revival)

# TEMPORARY probe artifact, not part of the product surface.
# DELETE together with the wave once the dispatch evidence is recorded
# (convention: separate add commit -> dispatch -> separate remove commit).
#
# Purpose: test the NEW main hypothesis for the deterministic deepmd
# compute-time SIGSEGV (rc=139): the fault happens inside libxsmm's
# JIT-generated kernel code, which lives in an ANONYMOUS executable mapping
# (layout stable across configs; no CFI in JIT code, so nothing can unwind
# through it -- consistent with the 3-frame libgfortran backtrace: those
# frames are the raise() delivery path after libxsmm/libxs re-raise).
#
# Verified facts the experiment matrix is built on (all from the pinned
# sources actually compiled by the image; do NOT substitute variable names):
#   * CP2K v2026.2 toolchain pins libxsmm 2.0.0
#     (tools/toolchain/scripts/stage4/install_libxsmm.sh:9-10, sha256
#     7e532dc5...a290b -- tarball downloaded from cp2k.org and hash-verified).
#   * libxsmm 2.0.0 registers SIGABRT/SIGSEGV handlers at load time via
#     signal() (src/libxsmm_main.c:1319-1322; handler 935-948: raise
#     verbosity -> internal_finalize() -> restore -> raise()). NOT LLVM:
#     2.0.0 has no LLVM dependency at all (no llvm path in the tree, no LLVM
#     in CMakeLists.txt); the JIT backend is the in-house x86 encoder
#     (generator_*.c + libxsmm_build, main.c:2109). The "LLVM" wording of
#     the original hypothesis is therefore NOT used in verdict tokens.
#   * JIT exec buffers: mmap(PROT_READ|PROT_WRITE|PROT_EXEC, MAP_ANONYMOUS)
#     (src/libxsmm_malloc.c:1408-1419) then mprotect(PROT_READ|PROT_EXEC)
#     (src/libxsmm_malloc.c:1682) -> /proc/self/maps shows an anonymous
#     r-xp/rwxp region: exactly what the E4 sniffer checks for.
#   * Runtime levers (all getenv-verified, semantics verified by compiling
#     the pinned source locally and running the arms):
#       LIBXSMM_TARGET=<name|int|none|generic|0>  (main.c:1131 -> 
#         libxsmm_set_target_arch main.c:1604; name table cpuid_x86.c:552-614;
#         "none" -> TARGET_ARCH_GENERIC(1); JIT gate main.c:2805 requires
#         archid >= LIBXSMM_X86_GENERIC(1002) -> with "none" no JIT kernel is
#         ever built and libxsmm_?gemm prints "LIBXSMM_GEMM failed" and
#         computes nothing (locally verified on the pinned source)).
#       LIBXSMM_VERBOSE=<int>  (main.c:1062; HIGH=3 main.h:163; negative
#         dumps every generated JIT kernel to a file named after the kernel
#         plus a "LIBXSMM-JIT-DUMP(ptr:file) 0x<addr> : <name>" line on fd 2
#         -- malloc.c:1733-1737/libxsmm_dump main.c:2037; locally verified:
#         file written into cwd, address = JIT buffer address in-process).
#       LIBXSMM_MAX_MNK is COMPILE-TIME only (no getenv anywhere; docs) --
#         deliberately NOT used.
#       LIBXS_GEMM_BACKEND=<0..4> (CP2K-side libxs 1.0.0, pinned sha256
#         de26f50c...d04d): 0=auto 1=mkl-jit 2=libxsmm 3=blas 4=fallback
#         (src/libxs_gemm.c:30-34; gates :487-490: use_xgemm=backend<=2,
#         use_blas=backend<=3); 3/4 bypass libxsmm with still-correct math.
#         LIBXS also registers its own SIGABRT/SIGSEGV handler
#         (src/libxs_main.c:552-555) -- second reason the sniffer interposes.
#
# Judgement (pre-registered; bare tokens, always-on matrix):
#   PASS_JIT_RIP_LOCKED : E4 handler ran AND the faulting RIP classifies as
#        an anonymous executable region (JIT code) -- or, stronger,
#        JIT_KERNEL_MATCHED: RIP falls inside a kernel binary dumped by
#        LIBXSMM_VERBOSE=-1 in the SAME process (exact kernel name+offset).
#   REFUTED_RIP_IN_NAMED_MODULE : RIP maps into a named .so/exe (module +
#        offset + symbol reported) -> the JIT hypothesis is refuted there.
#   INCONCLUSIVE_RIP_UNMAPPED / INCONCLUSIVE_* : RIP not attributable.
#   Independent corroboration tokens (never override the verdict):
#     PASS_JIT_BYPASS_AVOIDS_CRASH : E1 rc=139 and an E3 arm (libxsmm JIT
#        bypassed/restricted) exits rc=0 with ENERGY + PROGRAM ENDED.
#     NO_CRASH_BASELINE / BYPASS_ARM_ALSO_CRASHES as reported.
#   FAIL_IMAGE_BUILD / FAIL_SOURCES_NOT_WRITTEN / FAIL_NO_CRASH_REPRODUCED
#        / FAIL_HANDLER_NO_OUTPUT : tooling / reproduction facts.
#
# Matrix (one rebuild, one image, six container runs):
#   E1  baseline, no preload, no env                -> expect rc=139
#   E2  LIBXSMM_VERBOSE=3 (+LIBXS_GEMM_PRINT=0)     -> last libxsmm/libxs
#       output before the crash (banner/target, stats if the build counts)
#   E2B LD_PRELOAD=ripsnoop LIBXSMM_VERBOSE=-1 in a dedicated cwd
#       -> per-kernel JIT dumps; RIP matched against the dump addresses
#   E3A LIBXS_GEMM_BACKEND=3 (blas) / E3B =4 (libxs C fallback)
#   E3C LIBXSMM_TARGET=none (JIT eliminated; gemm fails, math affected)
#   E3D LIBXSMM_TARGET=hsw (AVX2-targeted JIT; different code path)
#   E4  LD_PRELOAD=ripsnoop (v3: sigaltstack, register-only dump, pre-opened
#       /proc/self/maps fd, fixed self-proof line) -> fault RIP + region
#
# All container runs are timeout-bounded; artifacts uploaded always (7 days).

on:
  workflow_dispatch:
  push:
    branches: [probe/libxsmm]

permissions:
  contents: read

concurrency:
  group: probe-libxsmm
  cancel-in-progress: false

jobs:
  probe:
    name: libxsmm JIT-RIP probe for the deepmd SIGSEGV
    runs-on: ubuntu-latest
    # Budget: same shape as probe-diagnose (image rebuild ~2h, cap 240) plus
    # six short runs (30 min cap) and in-image postprocessing (20 min); the
    # always-on matrix + artifact still fit under the 355 min job cap.
    timeout-minutes: 355
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo build (debug binary drives forge2k build)
        run: cargo build

      - name: "stage 1: forge2k build -m toolchain -v 2026.2 --features deepmd (hard gate)"
        id: build
        timeout-minutes: 240
        run: |
          set -uo pipefail
          rc=0
          printf 'y\n' | ./target/debug/forge2k build -m toolchain -v 2026.2 --cpu generic --cuda none --features deepmd 2>&1 | tee libxsmm-forge2k-build.log || rc=$?
          echo "===== forge2k build end rc=${rc} ====="
          if [ "${rc}" -ne 0 ]; then
            echo "BUILD_VERDICT:FAIL rc=${rc}"
            echo "BUILD_DETAIL: forge2k build failed; tail of libxsmm-forge2k-build.log follows"
            tail -n 60 libxsmm-forge2k-build.log || true
            exit 1
          fi
          IMAGE=cp2k/cp2k:2026.2_mpich_generic_psmp_deepmd
          if docker image inspect "${IMAGE}" >/dev/null 2>&1; then
            echo "PROBE_IMAGE=${IMAGE}" >> "${GITHUB_ENV}"
            echo "BUILD_VERDICT:PASS"
            echo "BUILD_DETAIL: image ${IMAGE} present after forge2k build"
            docker image inspect -f 'image_id={{.Id}} size_bytes={{.Size}}' "${IMAGE}" || true
          else
            echo "BUILD_VERDICT:FAIL rc=0 but ${IMAGE} is missing"
            docker images --format '{{.Repository}}:{{.Tag}}' | grep -iE '2026\.2|deepmd' || true
            exit 1
          fi

      - name: "stage 2: write libxsmm-ripsnoop.c + libxsmm-postproc.py (probe sources)"
        id: write
        run: |
          set -euo pipefail
          W=ci/cp2k-tests
          test -f "${W}/deepmd-water.inp" || { echo "WRITE_VERDICT:FAIL ${W}/deepmd-water.inp missing"; exit 1; }

          cat > "${W}/libxsmm-ripsnoop.c" <<'RIPSNOOP_C_EOF'
          /* libxsmm-ripsnoop.c -- LD_PRELOAD fault-RIP sniffer for the libxsmm probe.
           *
           * Purpose: capture the EXACT faulting RIP of the deepmd compute-time SIGSEGV
           * with NO dependency on being able to unwind (libxsmm JIT code carries no
           * CFI, so backtrace() stops there): the handler dumps ucontext registers
           * only, plus the /proc/self/maps table read through a PRE-OPENED fd
           * (async-signal-safe), plus the containing map line and raw bytes at the
           * fault address. The post-processor maps RIP -> region and answers:
           * anonymous executable region (JIT code) vs named module vs unmapped.
           *
           * Output protocol on fd 2 (consumed by libxsmm-postproc.py):
           *   libxsmm-ripsnoop: armed (LD_PRELOAD)     <- load-time marker
           *   -- on a fatal signal: --
           *   PRELOAD-V3-HANDLER-ENTERED               <- fixed self-proof line:
           *                                               distinguishes "handler never
           *                                               ran" from "ran and died"
           *   SIG=<n>
           *   RIP=0x<rip> / RSP=0x<rsp> / RBP=0x<rbp>
           *   FAULT=0x<si_addr>
           *   MAPS-BEGIN ... raw /proc/self/maps ... MAPS-END
           *   MAPHIT <the map line containing RIP>     (only if found)
           *   MAPHIT-PERMS=<perms> MAPHIT-ANON=<0|1> MAPHIT-SPECIAL=<0|1>
           *   RIPBYTES <2*N hex chars, N bytes at RIP>         (only if readable)
           *   REGBYTES <2*N hex chars, N bytes at region start> (anon exec only)
           *   SUPPRESS sigaction sig=<n> handler=0x.. refused ...  (interposer log,
           *   SUPPRESS-CALLER <dladdr best effort>                  see below)
           *   then _exit(139) -- the recorded crash exit status.
           *
           * Interposition: libgfortran, libxs and libxsmm each install a
           * fatal-signal handler early (libxsmm_main.c:1319-1322 registers via
           * signal(); the same shape lives in libxs_main.c:552-555). A constructor
           * handler would be silently displaced by them, so signal()/sigaction()
           * are interposed and foreign fatal-signal installs are REFUSED (logged),
           * which keeps THIS handler armed through the whole run -- and the log
           * doubles as evidence of who tried to install what.
           *
           * Signal-path safety: write(2)/lseek(2)/read(2)/vsnprintf() into stack or
           * static buffers only; no malloc, no backtrace(), no stdio, no signal
           * re-raise. SA_RESETHAND so a fault inside the reporter itself dies
           * immediately instead of looping; SA_ONSTACK + sigaltstack so a stack
           * overflow is still reportable.
           *
           * Build: gcc -shared -fPIC -O1 -Wall -o libxsmm-ripsnoop.so libxsmm-ripsnoop.c -ldl
           */
          #define _GNU_SOURCE
          #include <dlfcn.h>
          #include <fcntl.h>
          #include <signal.h>
          #include <stdarg.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <string.h>
          #include <ucontext.h>
          #include <unistd.h>

          #define LINE_MAX 512
          #define MAPS_MAX (1 << 20) /* 1 MiB static buffer for /proc/self/maps */
          #define HEXBYTES 128       /* bytes hex-dumped at RIP and at region start */
          #define EXIT_RC 139        /* the recorded deepmd crash exit status */
          #define ALTSTACK_SIZE (1 << 16)

          static const int fatal_sigs[] = {SIGSEGV, SIGABRT, SIGBUS, SIGILL, SIGFPE};
          #define FATAL_N ((int)(sizeof(fatal_sigs) / sizeof(fatal_sigs[0])))

          static int maps_fd = -1;          /* pre-opened in the constructor */
          static char maps_buf[MAPS_MAX];   /* handler-only scratch */
          static char hex_line[2 * HEXBYTES + 32];
          static char alt_stk[ALTSTACK_SIZE];

          static void crash_handler(int, siginfo_t *, void *);

          /* ---------- async-signal-safe output ---------- */

          static void
          put(const char *s, long n)
          {
            long off = 0;
            while (off < n) {
              ssize_t w = write(2, s + off, (size_t)(n - off));
              if (w <= 0) break;
              off += (long)w;
            }
          }

          static void
          putf(const char *fmt, ...)
          {
            char buf[LINE_MAX];
            va_list ap;
            int n;
            va_start(ap, fmt);
            n = vsnprintf(buf, sizeof(buf), fmt, ap);
            va_end(ap);
            if (n > 0) put(buf, n < (long)sizeof(buf) ? n : (long)sizeof(buf) - 1);
          }

          /* ---------- minimal hex parsing (no strtoul in the signal path) -------- */

          static unsigned long
          hexval(const char *p, const char **end)
          {
            unsigned long v = 0;
            while ('\0' != *p) {
              const char c = *p;
              if ('0' <= c && c <= '9') v = (v << 4) | (unsigned long)(c - '0');
              else if ('a' <= c && c <= 'f') v = (v << 4) | (unsigned long)(c - 'a' + 10);
              else if ('A' <= c && c <= 'F') v = (v << 4) | (unsigned long)(c - 'A' + 10);
              else break;
              ++p;
            }
            if (NULL != end) *end = p;
            return v;
          }

          static const char *
          skip_sp(const char *p)
          {
            while (' ' == *p || '\t' == *p) ++p;
            return p;
          }

          /* ---------- the crash report ---------- */

          static void
          dump_bytes(const char *tag, const unsigned char *p)
          {
            static const char hexd[] = "0123456789abcdef";
            int i;
            char *o = hex_line;
            for (i = 0; i < HEXBYTES; ++i) {
              *o++ = hexd[(p[i] >> 4) & 0xF];
              *o++ = hexd[p[i] & 0xF];
            }
            *o = '\0';
            putf("%s %s\n", tag, hex_line);
          }

          static void
          crash_handler(int sig, siginfo_t *si, void *uc)
          {
            unsigned long rip = 0, rsp = 0, rbp = 0;
            ssize_t m = -1;

            /* self-proof line FIRST: its absence after rc=139 means no handler run */
            putf("%s\n", "PRELOAD-V3-HANDLER-ENTERED");
            putf("SIG=%d\n", sig);

          #if defined(__x86_64__)
            if (NULL != uc) {
              const ucontext_t *u = (const ucontext_t *)uc;
              rip = (unsigned long)u->uc_mcontext.gregs[REG_RIP];
              rsp = (unsigned long)u->uc_mcontext.gregs[REG_RSP];
              rbp = (unsigned long)u->uc_mcontext.gregs[REG_RBP];
            }
          #endif
            putf("RIP=0x%lx\n", rip);
            putf("RSP=0x%lx\n", rsp);
            putf("RBP=0x%lx\n", rbp);
            if (NULL != si) putf("FAULT=0x%lx\n", (unsigned long)(uintptr_t)si->si_addr);
            else putf("%s\n", "FAULT=<none>");

            /* the maps table via the pre-opened fd (lseek+read: async-signal-safe) */
            if (0 <= maps_fd) {
              m = 0;
              if (0 == lseek(maps_fd, 0, SEEK_SET)) {
                for (;;) {
                  const ssize_t r = read(maps_fd, maps_buf + m, (size_t)(MAPS_MAX - 1 - m));
                  if (r <= 0) break;
                  m += r;
                  if (m >= MAPS_MAX - 1) break;
                }
              }
              if (m < 0) m = 0;
              maps_buf[m] = '\0';
            }
            putf("%s\n", "MAPS-BEGIN");
            if (0 < m) put(maps_buf, (long)m);
            putf("%s\n", "MAPS-END");

            /* locate the map entry containing RIP (plain pointer walks only) */
            if (0 < m) {
              char *line = maps_buf;
              while ('\0' != *line) {
                char *nl = strchr(line, '\n');
                const char *q = line;
                const char *qe = NULL;
                unsigned long lo = hexval(q, &qe), hi = 0;
                if (NULL != nl) *nl = '\0'; /* terminate in place for the MAPHIT echo */
                if ('-' == *qe) {
                  hi = hexval(qe + 1, &qe);
                  if (0 < rip && lo <= rip && rip < hi) {
                    const char *perms = skip_sp(qe);
                    int anon = 1, special = 0, readable = 0;
                    const char *field = perms;
                    int nf = 0;
                    for (;;) {
                      while (' ' != *field && '\t' != *field && '\0' != *field) ++field;
                      ++nf;
                      if ('\0' == *field) break;
                      field = skip_sp(field);
                      if ('\0' == *field) break;
                      if (4 <= nf) { anon = 0; if ('[' == *field) special = 1; }
                    }
                    readable = ('r' == perms[0]);
                    putf("MAPHIT %s\n", line);
                    putf("MAPHIT-PERMS=%.4s MAPHIT-ANON=%d MAPHIT-SPECIAL=%d\n",
                         perms, anon, special);
                    /* bytes at RIP: always mapped+readable on Linux (we faulted there
                     * on execute); bytes at region start only when readable and this
                     * is an anonymous executable region (the JIT-code signature). */
                    if (readable) {
                      dump_bytes("RIPBYTES", (const unsigned char *)(uintptr_t)rip);
                      if (anon && !special && 'x' == perms[2]) {
                        dump_bytes("REGBYTES", (const unsigned char *)(uintptr_t)lo);
                      }
                    }
                    break;
                  }
                }
                if (NULL == nl) break;
                line = nl + 1;
              }
            }
            putf("%s\n", "RIPSNOOP-END");
            _exit(EXIT_RC);
          }

          /* ---------- interposition: keep the sniffer armed ---------- */

          typedef int (*sigaction_fn)(int, const struct sigaction *, struct sigaction *);
          typedef void (*sighandler_fn)(int);
          typedef sighandler_fn (*signal_fn)(int, sighandler_fn);

          static sigaction_fn real_sigaction;
          static signal_fn real_signal;

          static void
          init_real(void)
          {
            if (!real_sigaction) real_sigaction = (sigaction_fn)dlsym(RTLD_NEXT, "sigaction");
            if (!real_signal) real_signal = (signal_fn)dlsym(RTLD_NEXT, "signal");
          }

          static const void *
          act_handler(const struct sigaction *act)
          {
            if (act->sa_flags & SA_SIGINFO) return (const void *)act->sa_sigaction;
            return (const void *)act->sa_handler;
          }

          static int
          is_foreign_handler(const void *want)
          {
            return want != (const void *)SIG_DFL && want != (const void *)SIG_IGN &&
                   want != (const void *)crash_handler;
          }

          /* non-handler context (library init time), so dladdr is fine here */
          static void
          log_refused(const char *what, int sig, const void *want)
          {
            Dl_info info;
            putf("SUPPRESS %s sig=%d handler=%p refused (ripsnoop keeps its own)\n",
                 what, sig, want);
            if (0 != dladdr(want, &info)) {
              putf("SUPPRESS-CALLER %s %s+0x%lx\n",
                   NULL != info.dli_fname ? info.dli_fname : "?",
                   NULL != info.dli_sname ? info.dli_sname : "<no-symbol>",
                   (NULL != info.dli_saddr ? (unsigned long)((const char *)want - (const char *)info.dli_saddr) : 0UL));
            }
          }

          int
          sigaction(int signum, const struct sigaction *act, struct sigaction *oldact)
          {
            init_real();
            if (!real_sigaction) return -1;
            if (NULL != act) {
              int i, fatal = 0;
              for (i = 0; i < FATAL_N; ++i) if (fatal_sigs[i] == signum) fatal = 1;
              if (fatal) {
                const void *want = act_handler(act);
                if (is_foreign_handler(want)) {
                  log_refused("sigaction", signum, want);
                  return real_sigaction(signum, NULL, oldact); /* report the live one */
                }
              }
            }
            return real_sigaction(signum, act, oldact);
          }

          sighandler_fn
          signal(int signum, sighandler_fn h)
          {
            init_real();
            if (NULL != h) {
              int i, fatal = 0;
              for (i = 0; i < FATAL_N; ++i) if (fatal_sigs[i] == signum) fatal = 1;
              if (fatal && is_foreign_handler((const void *)h)) {
                struct sigaction cur;
                log_refused("signal", signum, (const void *)h);
                if (real_sigaction && 0 == real_sigaction(signum, NULL, &cur)) return cur.sa_handler;
                return SIG_DFL;
              }
            }
            if (real_signal) return real_signal(signum, h);
            return SIG_ERR;
          }

          /* ---------- load-time arming ---------- */

          __attribute__((constructor)) static void
          arm_ripsnoop(void)
          {
            struct sigaction sa;
            stack_t ss;
            int i;

            init_real();
            putf("%s\n", "libxsmm-ripsnoop: armed (LD_PRELOAD)");

            ss.ss_sp = alt_stk;
            ss.ss_size = sizeof(alt_stk);
            ss.ss_flags = 0;
            if (0 != sigaltstack(&ss, NULL)) {
              putf("%s\n", "libxsmm-ripsnoop: WARNING sigaltstack failed");
            }

            maps_fd = open("/proc/self/maps", O_RDONLY);
            if (0 > maps_fd) {
              putf("%s\n", "libxsmm-ripsnoop: WARNING open(/proc/self/maps) failed");
            }

            memset(&sa, 0, sizeof(sa));
            sa.sa_sigaction = crash_handler;
            sa.sa_flags = SA_SIGINFO | SA_ONSTACK | SA_RESETHAND | SA_NODEFER;
            sigemptyset(&sa.sa_mask);
            for (i = 0; i < FATAL_N; ++i) {
              if (real_sigaction) real_sigaction(fatal_sigs[i], &sa, NULL);
            }
            putf("%s\n", "libxsmm-ripsnoop: armed-complete");
          }

          RIPSNOOP_C_EOF

          cat > "${W}/libxsmm-postproc.py" <<'LIBXSMM_POSTPROC_PY_EOF'
          #!/usr/bin/env python3
          """libxsmm-postproc.py -- classify the E4 fault RIP and join the E2b JIT
          kernel dumps of the libxsmm probe.

          Usage: python3 libxsmm-postproc.py <workdir> [<out-file>]

          Consumes (all optional; missing inputs degrade to NA):
            <workdir>/e4.err            ripsnoop output (regs + /proc/self/maps + MAPHIT)
            <workdir>/e2b.err           LIBXSMM_VERBOSE=-1 run under the ripsnoop
            <workdir>/e2b-jitdump/*     per-kernel binary dumps written by libxsmm
            <workdir>/e1.err, e2.err    libgfortran-style "#N 0x.." addresses
            <workdir>/e*.out            cp2k outputs (ENERGY / PROGRAM ENDED)
            <workdir>/libxsmm-run-verdict.txt   host-side rc lines

          Emits bare SUMMARY: lines + a SUBPROC_VERDICT line set; optionally writes
          them to <out-file> as well.
          """
          import os
          import re
          import subprocess
          import sys

          HEX = re.compile(r'0x[0-9a-fA-F]+')
          JTDUMP = re.compile(r'LIBXSMM-JIT-DUMP\(ptr:file\)\s+(0x[0-9a-fA-F]+)\s*:\s+(\S+)')
          BACKTRACE = re.compile(r'#[0-9]+\s+(0x[0-9a-fA-F]+)')


          def read(path):
              try:
                  with open(path, 'r', errors='replace') as f:
                      return f.read()
              except OSError:
                  return ''


          def low12_of(addrs):
              return sorted(set('0x%03x' % (int(a, 16) & 0xFFF) for a in addrs))


          def section(text, begin, end):
              i = text.find(begin)
              if i < 0:
                  return None
              i += len(begin)
              j = text.find(end, i)
              return text[i:j if j >= 0 else len(text)]


          def parse_ripsnoop(text):
              out = {'handler': False}
              if 'PRELOAD-V3-HANDLER-ENTERED' in text:
                  out['handler'] = True
              for key, pat in (
                  ('sig', r'^SIG=(\d+)$'), ('rip', r'^RIP=(0x[0-9a-fA-F]+)$'),
                  ('rsp', r'^RSP=(0x[0-9a-fA-F]+)$'), ('rbp', r'^RBP=(0x[0-9a-fA-F]+)$'),
                  ('fault', r'^FAULT=(0x[0-9a-fA-F]+)$'),
              ):
                  m = re.search(pat, text, re.M)
                  if m:
                      out[key] = m.group(1)
              m = re.search(r'^MAPHIT (.*)$', text, re.M)
              if m:
                  out['maphit'] = m.group(1).strip()
              m = re.search(r'^MAPHIT-PERMS=(\S+) MAPHIT-ANON=(\d) MAPHIT-SPECIAL=(\d)$', text, re.M)
              if m:
                  out['perms'] = m.group(1)
                  out['anon'] = m.group(2) == '1'
                  out['special'] = m.group(3) == '1'
              m = re.search(r'^RIPBYTES ([0-9a-f]+)$', text, re.M)
              if m:
                  out['ripbytes'] = m.group(1)
              m = re.search(r'^REGBYTES ([0-9a-f]+)$', text, re.M)
              if m:
                  out['regbytes'] = m.group(1)
              maps = section(text, 'MAPS-BEGIN\n', 'MAPS-END\n') if 'MAPS-BEGIN' in text else ''
              out['maps'] = maps
              supp = re.findall(r'^SUPPRESS .*$', text, re.M)
              out['suppress'] = len(supp)
              out['suppress_caller'] = (re.findall(r'^SUPPRESS-CALLER (.*)$', text, re.M) or ['NA'])[0]
              return out


          def nearest_symbol(module, addr):
              """nm -D binary search fallback; best effort."""
              try:
                  r = subprocess.run(['nm', '-D', '-S', '--defined-only', '-C', module],
                                     capture_output=True, text=True, timeout=60)
              except (OSError, subprocess.TimeoutExpired):
                  return None
              best = None
              for line in r.stdout.splitlines():
                  f = line.split(None, 3)
                  if len(f) < 4:
                      continue
                  try:
                      a = int(f[0], 16)
                      sz = int(f[1], 16)
                  except ValueError:
                      continue
                  if a <= addr < a + max(sz, 1):
                      best = '%s+0x%x' % (f[3], addr - a)
              return best


          def classify(out):
              """E4 RIP classification -> (class_token, detail)."""
              if not out.get('handler'):
                  return 'no_handler', 'handler did not run'
              rip = out.get('rip')
              if not rip:
                  return 'unknown', 'no RIP in output'
              ripv = int(rip, 16)
              line = out.get('maphit')
              if not line:
                  return 'unmapped', 'RIP not inside any maps entry'
              if out.get('anon') and not out.get('special'):
                  perms = out.get('perms', '')
                  if 'x' in perms:
                      return 'anon_exec', 'anonymous executable region (%s) -- JIT-style code' % perms
                  return 'anon_data', 'anonymous non-exec region (%s)' % perms
              if out.get('special'):
                  return 'special', 'special region: %s' % line
              # named module: line = "start-end perms offset dev inode pathname"
              m = re.match(r'^([0-9a-f]+)-[0-9a-f]+ \S+ \S+ \S+ \S+ +(.*)$', line)
              if not m:
                  return 'unknown', 'unparsable map line: %s' % line
              base = int(m.group(1), 16)
              path = m.group(2).strip()
              off = ripv - base
              detail = '%s+0x%x' % (path, off)
              sym = nearest_symbol(path, off) if os.path.exists(path) else None
              if sym:
                  detail += ' (%s)' % sym
              ab = None
              if os.path.exists(path):
                  try:
                      ab = subprocess.run(['addr2line', '-f', '-C', '-e', path, '0x%x' % off],
                                          capture_output=True, text=True, timeout=60)
                  except (OSError, subprocess.TimeoutExpired):
                      ab = None
              if ab is not None and ab.returncode == 0 and ab.stdout.strip():
                  detail += ' addr2line=[%s]' % ab.stdout.strip().replace('\n', ' ')
              return 'named', detail


          def parse_jit_dumps(workdir, err_text):
              dumps = []
              jd = os.path.join(workdir, 'e2b-jitdump')
              for addr, name in JTDUMP.findall(err_text):
                  path = os.path.join(jd, name)
                  try:
                      size = os.path.getsize(path)
                  except OSError:
                      size = 0
                  dumps.append((int(addr, 16), size, name))
              return dumps


          def match_kernel(dumps, rip):
              if not rip:
                  return None
              r = int(rip, 16)
              for addr, size, name in dumps:
                  if size > 0 and addr <= r < addr + size:
                      return '%s:+0x%x' % (name, r - addr)
              return None


          def run_facts(workdir):
              v = read(os.path.join(workdir, 'libxsmm-run-verdict.txt'))
              return dict(re.findall(r'^([A-Z0-9_]+)=(.*)$', v, re.M))


          def main():
              workdir = sys.argv[1] if len(sys.argv) > 1 else '.'
              out_file = sys.argv[2] if len(sys.argv) > 2 else None
              L = []

              e4 = parse_ripsnoop(read(os.path.join(workdir, 'e4.err')))
              e2b_text = read(os.path.join(workdir, 'e2b.err'))
              e2b = parse_ripsnoop(e2b_text)
              dumps = parse_jit_dumps(workdir, e2b_text)
              facts = run_facts(workdir)

              cls, detail = classify(e4)
              kmatch = match_kernel(dumps, e4.get('rip'))

              e1_addrs = BACKTRACE.findall(read(os.path.join(workdir, 'e1.err')))
              e2_addrs = BACKTRACE.findall(read(os.path.join(workdir, 'e2.err')))
              low12_e1 = low12_of(e1_addrs)
              low12_e2 = low12_of(e2_addrs)
              low12_e4 = low12_of([e4['rip']]) if e4.get('rip') else []

              def arm_out(fname):
                  t = read(os.path.join(workdir, fname))
                  m = re.search(r'^\s*ENERGY\|.*?(-?\d+\.\d+E?[-+]?\d*)\s*$', t, re.M)
                  energy = m.group(1) if m else 'NA'
                  ended = 'yes' if 'PROGRAM ENDED' in t else 'no'
                  return energy, ended, len(t)

              L.append('SUMMARY: E4_HANDLER=%s' % ('yes' if e4.get('handler') else 'no'))
              L.append('SUMMARY: E4_SIG=%s RIP=%s RSP=%s RBP=%s FAULT=%s'
                       % (e4.get('sig', 'NA'), e4.get('rip', 'NA'), e4.get('rsp', 'NA'),
                          e4.get('rbp', 'NA'), e4.get('fault', 'NA')))
              L.append('SUMMARY: E4_RIP_CLASS=%s' % cls)
              L.append('SUMMARY: E4_RIP_DETAIL=%s' % detail)
              L.append('SUMMARY: E4_RIP_PREVIEW=%s' % (e4.get('ripbytes', 'NA')[:64]))
              L.append('SUMMARY: E4_SUPPRESSED=%s SUPPRESS_CALLER=%s'
                       % (e4.get('suppress', 'NA'), e4.get('suppress_caller', 'NA')))
              L.append('SUMMARY: E2B_HANDLER=%s E2B_SIG=%s E2B_RIP=%s'
                       % ('yes' if e2b.get('handler') else 'no', e2b.get('sig', 'NA'), e2b.get('rip', 'NA')))
              L.append('SUMMARY: E2B_KERNEL_DUMP_FILES=%d' % len(dumps))
              L.append('SUMMARY: E2B_JIT_KERNEL_MATCH=%s' % (kmatch if kmatch else 'none'))
              if dumps:
                  L.append('SUMMARY: E2B_FIRST_KERNELS=%s' % ';'.join('%s@0x%x(%dB)' % (n, a, s) for a, s, n in dumps[:3]))
              e2_text = read(os.path.join(workdir, 'e2.err'))
              L.append('SUMMARY: E2_LIBXSMM_LINES=%d' % len(re.findall(r'^LIBXSMM', e2_text, re.M)))
              L.append('SUMMARY: E2_TRYJIT_TABLE=%s'
                       % ('yes' if re.search(r'^\s*\S+\s+TRY\s+JIT\s+STA\s+COL', e2_text, re.M) else 'no'))
              L.append('SUMMARY: LOW12_E1=%s' % (','.join(low12_e1) or 'NA'))
              L.append('SUMMARY: LOW12_E2=%s' % (','.join(low12_e2) or 'NA'))
              L.append('SUMMARY: LOW12_E4_RIP=%s' % (','.join(low12_e4) or 'NA'))
              for arm, fname in (('E1', 'e1.out'), ('E2', 'e2.out'), ('E2B', 'e2b.out'),
                                 ('E3A', 'e3a.out'), ('E3B', 'e3b.out'),
                                 ('E3C', 'e3c.out'), ('E3D', 'e3d.out'), ('E4', 'e4.out')):
                  energy, ended, nbytes = arm_out(fname)
                  L.append('SUMMARY: %s_RC=%s %s_ENERGY=%s %s_ENDED=%s %s_OUT_BYTES=%d'
                           % (arm, facts.get(arm + '_RC', 'NA'), arm, energy, arm, ended, arm, nbytes))

              # tokens
              sub = []
              if cls == 'anon_exec' or kmatch:
                  sub.append('LOCKED_JIT_RIP')
              if kmatch:
                  sub.append('JIT_KERNEL_MATCHED')
              if cls == 'named':
                  sub.append('RIP_IN_NAMED_MODULE')
              if cls == 'unmapped':
                  sub.append('RIP_UNMAPPED')
              if cls == 'no_handler':
                  sub.append('NO_HANDLER_OUTPUT')
              if facts.get('E1_RC') == '139' and facts.get('E1_RC') != facts.get('E3A_RC'):
                  sub.append('BYPASS_CHANGES_OUTCOME')
              L.append('SUBPROC_VERDICT:%s' % (','.join(sub) if sub else 'INCONCLUSIVE'))

              text = '\n'.join(L) + '\n'
              sys.stdout.write(text)
              if out_file:
                  with open(out_file, 'w') as f:
                      f.write(text)


          if __name__ == '__main__':
              main()

          LIBXSMM_POSTPROC_PY_EOF

          python3 -m py_compile "${W}/libxsmm-postproc.py" && echo "PY_SYNTAX_OK"
          grep -q 'PRELOAD-V3-HANDLER-ENTERED' "${W}/libxsmm-ripsnoop.c" || { echo "WRITE_VERDICT:FAIL heredoc lost content (c)"; exit 1; }
          grep -q 'JIT-DUMP' "${W}/libxsmm-postproc.py" || { echo "WRITE_VERDICT:FAIL heredoc lost content (py)"; exit 1; }
          echo "RIPSNOOP_C_SHA256=$(sha256sum "${W}/libxsmm-ripsnoop.c" | cut -d' ' -f1)"
          echo "POSTPROC_PY_SHA256=$(sha256sum "${W}/libxsmm-postproc.py" | cut -d' ' -f1)"
          echo "WRITE_VERDICT:PASS"

      - name: "stage 3: experiments E1/E2/E2B/E3A-E3D/E4 (six container runs)"
        id: exp
        if: always() && steps.build.outcome == 'success'
        timeout-minutes: 30
        run: |
          set -uo pipefail
          W="${PWD}/ci/cp2k-tests"
          IMAGE="${PROBE_IMAGE}"

          echo "===== tooling facts + build sniffer (probe image) ====="
          timeout 600 docker run --rm -v "${W}:/work" -w /work "${IMAGE}" bash -c '
            set -u
            echo "cp2k_path=$(command -v cp2k || echo MISSING)"
            echo "gcc=$(gcc --version 2>/dev/null | head -n 1 || echo MISSING)"
            echo "python3=$(python3 --version 2>&1 || echo MISSING)"
            echo "addr2line=$(command -v addr2line || echo MISSING)"
            echo "objdump=$(command -v objdump || echo MISSING)"
            echo "nm=$(command -v nm || echo MISSING)"
            LC=$(ls /opt/cp2k/install/lib/libcp2k.so.* 2>/dev/null | head -n 1)
            echo "libcp2k=${LC:-MISSING}"
            if [ -n "${LC}" ]; then
              echo "libcp2k_xsmm_strings=$(strings -a "${LC}" | grep -c -i xsmm || true)"
              echo "libcp2k_xsmm_dynsyms=$(nm -D "${LC}" 2>/dev/null | grep -c -i "xsmm\|libxs" || true)"
              echo "libcp2k_ldd_xsmm=$(ldd "${LC}" 2>/dev/null | grep -c -i xsmm || true)"
            fi
            if command -v gcc >/dev/null 2>&1; then
              gcc -shared -fPIC -O1 -Wall -o /work/libxsmm-ripsnoop.so /work/libxsmm-ripsnoop.c -ldl 2> /work/ripsnoop-gcc.stderr
              echo "RIPSNOOP_GCC_RC=$?"
              echo "RIPSNOOP_GCC_WARN_LINES=$(wc -l < /work/ripsnoop-gcc.stderr)"
              echo "RIPSNOOP_SO_SHA256=$(sha256sum /work/libxsmm-ripsnoop.so 2>/dev/null | cut -d" " -f1)"
            else
              echo "RIPSNOOP_GCC_RC=NA (no gcc)"
            fi
          ' 2>&1 | tee libxsmm-tooling.txt || true

          run_arm() {
            # $1 arm tag, $2 extra env assignments (may be empty), $3 cwd, $4 1 = preload
            arm="$1"; envs="$2"; cwd="$3"; pre="$4"
            timeout 900 docker run --rm --shm-size=1g -v "${W}:/work" -w /work "${IMAGE}" bash -c "
              set -u
              mkdir -p '${cwd}'
              cd '${cwd}'
              rc=0
              if [ '${pre}' = '1' ]; then
                ${envs} LD_PRELOAD=/work/libxsmm-ripsnoop.so cp2k -i /work/deepmd-water.inp -o /work/${arm}.out 2> /work/${arm}.err || rc=\$?
              else
                ${envs} cp2k -i /work/deepmd-water.inp -o /work/${arm}.out 2> /work/${arm}.err || rc=\$?
              fi
              echo '${arm}_RUN_RC='\$rc
              exit 0
            " 2>&1 | tee "libxsmm-${arm}-console.txt" || true
          }

          echo "===== E1 baseline (expect rc=139) ====="
          run_arm e1 "" /work 0
          echo "===== E2 LIBXSMM_VERBOSE=3, LIBXS_GEMM_PRINT=0 (no preload: libxsmm/libxs report before the crash) ====="
          run_arm e2 "LIBXSMM_VERBOSE=3 LIBXS_GEMM_PRINT=0" /work 0
          echo "===== E2B LIBXSMM_VERBOSE=-1 + preload, dedicated cwd (per-kernel JIT dumps) ====="
          run_arm e2b "LIBXSMM_VERBOSE=-1" /work/e2b-jitdump 1
          echo "===== E3A LIBXS_GEMM_BACKEND=3 (blas) ====="
          run_arm e3a "LIBXS_GEMM_BACKEND=3" /work 0
          echo "===== E3B LIBXS_GEMM_BACKEND=4 (libxs C fallback) ====="
          run_arm e3b "LIBXS_GEMM_BACKEND=4" /work 0
          echo "===== E3C LIBXSMM_TARGET=none (JIT eliminated; math affected) ====="
          run_arm e3c "LIBXSMM_TARGET=none" /work 0
          echo "===== E3D LIBXSMM_TARGET=hsw (AVX2 JIT code path) ====="
          run_arm e3d "LIBXSMM_TARGET=hsw" /work 0
          echo "===== E4 preload v3 (register-only dump + maps classification input) ====="
          run_arm e4 "" /work 1

          echo "===== host-side run facts ====="
          {
            for arm in e1 e2 e2b e3a e3b e3c e3d e4; do
              rc="$(sed -n "s/^${arm}_RUN_RC=//p" "libxsmm-${arm}-console.txt" 2>/dev/null | tail -1)"
              echo "$(echo ${arm} | tr a-z A-Z)_RC=${rc:-NA}"
            done
          } | tee libxsmm-run-verdict.txt

          echo "--- E2B JIT-dump kernel files ---"
          ls -la "${W}/e2b-jitdump" 2>/dev/null | head -n 8 || echo "(none)"
          echo "E2B_KERNEL_DUMP_FILES=$(find "${W}/e2b-jitdump" -maxdepth 1 -type f 2>/dev/null | wc -l || echo 0)"
          echo "--- E4 handler lines ---"
          grep -m2 -E "PRELOAD-V3-HANDLER-ENTERED|^RIP=|^MAPHIT " "${W}/e4.err" 2>/dev/null || echo "(no handler output; see libxsmm-e4-console.txt)"
          echo "--- E2 libxsmm/libxs output lines ---"
          grep -c -E "^LIBXSMM|^LIBXS " "${W}/e2.err" 2>/dev/null || echo 0
          EXP_VERDICT=PASS
          echo "EXP_VERDICT:${EXP_VERDICT}"

      - name: "stage 4: in-image postprocessing (RIP classification + JIT kernel match)"
        id: post
        if: always() && steps.build.outcome == 'success'
        timeout-minutes: 20
        run: |
          set -uo pipefail
          W="${PWD}/ci/cp2k-tests"
          IMAGE="${PROBE_IMAGE}"
          timeout 600 docker run --rm -v "${W}:/work" -w /work "${IMAGE}" bash -c '
            set -u
            if ! command -v python3 >/dev/null 2>&1; then
              echo "SUBPROC_VERDICT:FAIL_NO_PYTHON"
              sed -n "1,200p" /work/libxsmm-postproc-summary.txt 2>/dev/null || true
              exit 0
            fi
            python3 /work/libxsmm-postproc.py /work /work/libxsmm-postproc-summary.txt
            echo "SUBPROC_VERDICT_LINE:$(grep -m1 "^SUBPROC_VERDICT:" /work/libxsmm-postproc-summary.txt 2>/dev/null || echo SUBPROC_VERDICT:NA)"
          ' 2>&1 | tee libxsmm-postproc-console.txt || true
          grep -m1 "^SUBPROC_VERDICT:" libxsmm-postproc-console.txt || echo "SUBPROC_VERDICT:NA"

      - name: "stage 5: verdict matrix"
        if: always()
        run: |
          set -uo pipefail
          W="${PWD}/ci/cp2k-tests"
          build="${{ steps.build.outcome }}"
          write="${{ steps.write.outcome }}"
          S="${W}/libxsmm-postproc-summary.txt"
          sv() { sed -n "s/^SUMMARY: $1=//p" "${S}" 2>/dev/null | tail -1; }
          e1_rc="$(sed -n 's/^E1_RC=//p' libxsmm-run-verdict.txt 2>/dev/null | tail -1)"
          e3a_rc="$(sed -n 's/^E3A_RC=//p' libxsmm-run-verdict.txt 2>/dev/null | tail -1)"
          e3c_rc="$(sed -n 's/^E3C_RC=//p' libxsmm-run-verdict.txt 2>/dev/null | tail -1)"
          rip_class="$(sv E4_RIP_CLASS)"
          rip_detail="$(sv E4_RIP_DETAIL)"
          rip_line="$(sv E4_SIG; sv E4_RIP)"
          handler="$(sv E4_HANDLER)"
          kmatch="$(sv E2B_JIT_KERNEL_MATCH)"
          kdumps="$(sv E2B_KERNEL_DUMP_FILES)"
          {
            echo "===== PROBE_VERDICT_MATRIX (libxsmm JIT-RIP probe) ====="
            echo "stage1 forge2k build (image) : ${build}"
            echo "stage2 probe sources         : ${write}"
            echo "----- run facts -----"
            sed -n '1,20p' libxsmm-run-verdict.txt 2>/dev/null || true
            echo "E4 handler fired             : ${handler:-NA}"
            echo "E4 regs                      : $(sed -n 's/^SUMMARY: E4_SIG=/SIG=/p' "${S}" 2>/dev/null | tail -1)"
            echo "E4 RIP class                 : ${rip_class:-NA}"
            echo "E4 RIP detail                : ${rip_detail:-NA}"
            echo "E2B kernel dumps / match     : ${kdumps:-NA} / ${kmatch:-NA}"
            echo "E2 libxsmm/libxs lines       : $(sv E2_LIBXSMM_LINES)"
            echo "E2 TRY/JIT stats table       : $(sv E2_TRYJIT_TABLE)"
            echo "----- per-arm rc / energy / program-ended -----"
            for arm in E1 E2 E2B E3A E3B E3C E3D E4; do
              echo "$(sv ${arm}_RC) $(sv ${arm}_ENERGY) $(sv ${arm}_ENDED)" | sed "s/^/${arm} /"
            done
            echo "LOW12 E1 / E4 RIP            : $(sv LOW12_E1) / $(sv LOW12_E4_RIP)"
            echo "----- libxsmm JIT-code features in the dumped RIP bytes (first 32 hex) -----"
            echo "E4 RIP byte preview          : $(sv E4_RIP_PREVIEW)"
          } | tee libxsmm-verdict-matrix.txt

          verdict=INCONCLUSIVE
          reading="no decisive classification; read the matrix and the artifacts"
          extra=""
          if [ "${build}" != "success" ]; then
            verdict=FAIL_IMAGE_BUILD
            reading="the image rebuild failed; no experiment could run"
          elif [ "${write}" != "success" ]; then
            verdict=FAIL_SOURCES_NOT_WRITTEN
            reading="probe sources were not written; nothing could run"
          elif [ "${e1_rc:-NA}" != "139" ]; then
            verdict=FAIL_NO_CRASH_REPRODUCED
            reading="E1 baseline exited ${e1_rc:-NA}, not 139: the crash did not reproduce; the rest of the matrix describes a non-crashing run"
          elif [ "${handler:-NA}" != "yes" ]; then
            verdict=FAIL_HANDLER_NO_OUTPUT
            reading="rc=139 but the sniffer never entered its handler (see SUPPRESS lines and libxsmm-e4-console.txt)"
          elif [ "${kmatch:-none}" != "none" ]; then
            verdict=PASS_JIT_RIP_LOCKED
            reading="RIP falls INSIDE a JIT kernel dumped in the same process by LIBXSMM_VERBOSE=-1: ${kmatch} (kernel name is in the artifact; disassemble the dump around that offset)"
          elif [ "${rip_class:-NA}" = "anon_exec" ]; then
            verdict=PASS_JIT_RIP_LOCKED
            reading="faulting RIP is inside an anonymous executable region (${rip_detail}); JIT-code hypothesis locked -- cross-check the kernel dumps and the E2B/E4 byte previews"
          elif [ "${rip_class:-NA}" = "named" ]; then
            verdict=REFUTED_RIP_IN_NAMED_MODULE
            reading="faulting RIP maps into a named module (${rip_detail}); the libxsmm-JIT-code hypothesis is refuted at this crash point -- report this module+offset as the new anchor"
          elif [ "${rip_class:-NA}" = "unmapped" ]; then
            verdict=INCONCLUSIVE_RIP_UNMAPPED
            reading="RIP is not inside any /proc/self/maps entry (${rip_detail}); read the raw map dump in the artifact"
          fi
          if [ "${e1_rc:-NA}" = "139" ] && [ "${e3a_rc:-NA}" = "0" ]; then
            extra="${extra} PASS_JIT_BYPASS_AVOIDS_CRASH(E3A:libxs-blas)"
          fi
          if [ "${e1_rc:-NA}" = "139" ] && [ "${e3c_rc:-NA}" = "0" ]; then
            extra="${extra} PASS_JIT_BYPASS_AVOIDS_CRASH(E3C:LIBXSMM_TARGET=none)"
          fi
          {
            echo "PROBE_VERDICT:${verdict}"
            echo "PROBE_VERDICT_READING: ${reading}"
            echo "PROBE_VERDICT_EXTRA:${extra:- none}"
          } | tee -a libxsmm-verdict-matrix.txt

      - name: upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-libxsmm-evidence
          path: |
            ci/cp2k-tests/libxsmm-ripsnoop.c
            ci/cp2k-tests/libxsmm-postproc.py
            ci/cp2k-tests/libxsmm-ripsnoop.so
            ci/cp2k-tests/ripsnoop-gcc.stderr
            ci/cp2k-tests/e1.out
            ci/cp2k-tests/e1.err
            ci/cp2k-tests/e2.out
            ci/cp2k-tests/e2.err
            ci/cp2k-tests/e2b.out
            ci/cp2k-tests/e2b.err
            ci/cp2k-tests/e3a.out
            ci/cp2k-tests/e3a.err
            ci/cp2k-tests/e3b.out
            ci/cp2k-tests/e3b.err
            ci/cp2k-tests/e3c.out
            ci/cp2k-tests/e3c.err
            ci/cp2k-tests/e3d.out
            ci/cp2k-tests/e3d.err
            ci/cp2k-tests/e4.out
            ci/cp2k-tests/e4.err
            ci/cp2k-tests/e2b-jitdump/
            ci/cp2k-tests/libxsmm-postproc-summary.txt
            libxsmm-forge2k-build.log
            libxsmm-tooling.txt
            libxsmm-run-verdict.txt
            libxsmm-e1-console.txt
            libxsmm-e2-console.txt
            libxsmm-e2b-console.txt
            libxsmm-e3a-console.txt
            libxsmm-e3b-console.txt
            libxsmm-e3c-console.txt
            libxsmm-e3d-console.txt
            libxsmm-e4-console.txt
            libxsmm-postproc-console.txt
            libxsmm-verdict-matrix.txt
          if-no-files-found: ignore
          retention-days: 7
